# Publishes a pi-studio release from an annotated v0.MINOR.PATCH tag on main.
#
# The tag is the trigger and the version: nothing is published from a branch, and no run invents a
# version. Two jobs, because assets appear only after everything has passed.
#
#   verify   proves that the tag, package.json and package-lock.json name one version, that the tag is
#            annotated and sits on main, and that the tagged tree is clean; runs the full check gate;
#            builds the three assets with `npm run package` and keeps them as the run's artifact.
#   publish  makes a draft GitHub Release from that artifact, uploads exactly the three assets, and
#            publishes it as the latest release only once all three are there. A release that is
#            already published is never replaced; the run fails instead.
#
# Node is pinned to the floor in package.json engines (>=22.18), because that floor is what a release
# has to run on and a newer Node would not prove it.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag and build the assets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - name: Refuse a tag that does not name this version
        id: check
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          lockVersion="$(node -p 'require("./package-lock.json").version')"
          lockRoot="$(node -p 'require("./package-lock.json").packages[""].version')"
          echo "tag $TAG, package.json $version, package-lock.json $lockVersion / $lockRoot"
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a v0.MINOR.PATCH version"; exit 1; }
          [[ "$TAG" == "v$version" ]] || { echo "::error::$TAG does not match package.json version $version"; exit 1; }
          [[ "$lockVersion" == "$version" && "$lockRoot" == "$version" ]] || { echo "::error::package-lock.json carries $lockVersion / $lockRoot, not $version"; exit 1; }
          commit="$(git rev-list -n 1 "$TAG")"
          # The checkout step fetched the new tag and then refetched its commit into the local
          # tag ref, so locally the tag looks like a plain commit. The annotated tag object only
          # shows on the remote ref: an annotated tag has a `${TAG}^{}` dereference to the commit.
          [[ "$(git ls-remote origin "refs/tags/${TAG}^{}" | cut -f1)" == "$commit" ]] || { echo "::error::$TAG is not an annotated tag on the tagged commit"; exit 1; }
          git merge-base --is-ancestor "$commit" origin/main || { echo "::error::$TAG does not sit on main"; exit 1; }
          dirty="$(git status --porcelain)"
          [[ -z "$dirty" ]] || { echo "::error::the tagged tree is not clean: $dirty"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the locked dependencies
        run: npm ci
      - name: Run the full check gate
        run: npm run check
      - name: Build and package the release
        run: npm run package
      - name: Prove the asset set
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          tarball="release/pi-studio-$VERSION.tar.gz"
          checksum="$tarball.sha256"
          installer="release/install.sh"
          for asset in "$tarball" "$checksum" "$installer"; do
            [[ -f "$asset" ]] || { echo "::error::npm run package did not write $asset"; exit 1; }
          done
          # List the archive once into a variable; grepping tar's output directly makes `grep -q`
          # close the pipe early, tar dies of SIGPIPE and pipefail reports a failure that is not one.
          listing="$(tar -tzf "$tarball")"
          top="$(printf '%s\n' "$listing" | cut -d/ -f1 | sort -u)"
          [[ -n "$top" && "$(printf '%s\n' "$top" | wc -l)" == "1" ]] || { echo "::error::$tarball does not hold exactly one top-level folder"; exit 1; }
          if grep -Eq '^[^/]+/(node_modules|test|test-support)/' <<< "$listing"; then
            echo "::error::$tarball carries a development tree"; exit 1
          fi
          expected="$(awk 'NR == 1 { print $1 }' "$checksum")"
          actual="$(sha256sum "$tarball" | awk '{ print $1 }')"
          [[ "$expected" == "$actual" ]] || { echo "::error::$checksum does not describe $tarball"; exit 1; }
          grep -qF "$VERSION" "$installer" || { echo "::error::$installer does not name version $VERSION"; exit 1; }
          # A clean official build of this tag, which is what `official` in build.json means.
          grep -qx "$top/build.json" <<< "$listing" || { echo "::error::$tarball carries no $top/build.json"; exit 1; }
          identity="$(tar -xzOf "$tarball" "$top/build.json")"
          grep -q '"official": true' <<< "$identity" || { echo "::error::the packaged build is not an official build of $VERSION"; exit 1; }
          grep -qF "\"version\": \"$VERSION\"" <<< "$identity" || { echo "::error::the packaged build names another version than $VERSION"; exit 1; }
          # The release notes are the dated changelog section for this version, and there is no
          # fallback: the heading must carry a real YYYY-MM-DD calendar date, the section must
          # hold notes, and a bullet that still names the thread that wrote it has not been
          # prepared for release. bin/release-notes.mjs is the whole guard, tested directly.
          node bin/release-notes.mjs "$VERSION" CHANGELOG.md release/release-notes.md
      - name: Keep the assets for the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub Release
    needs: verify
    # A fork that pushes a tag has no release to publish; the repository the token belongs to decides.
    if: github.repository == 'theMladyPan/pi-studio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish without ever replacing a published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job never checks the repository out; without it `gh` has no git remote
          # to resolve the repository from and every release command fails before it starts.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          tarball="pi-studio-$VERSION.tar.gz"
          state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)"
          case "$state" in
            missing) ;;
            true) echo "pi-studio: removing the earlier draft of $tag so a failed run can be repeated"; gh release delete "$tag" --yes ;;
            *) echo "::error::release $tag is already published; a published version, its tag and its assets are never replaced. Repair a bad release with a new version."; exit 1 ;;
          esac
          gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file release/release-notes.md \
            "release/$tarball" "release/$tarball.sha256" "release/install.sh"
          uploaded="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          wanted="$(printf '%s\n' install.sh "$tarball" "$tarball.sha256" | sort)"
          [[ "$uploaded" == "$wanted" ]] || { echo "::error::the draft holds '$uploaded', expected '$wanted'"; exit 1; }
          gh release edit "$tag" --draft=false --latest
          echo "pi-studio: published $tag as the latest release"
