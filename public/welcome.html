<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-studio</title>
<link rel="stylesheet" href="/welcome.css" />
</head>
<body>

<main class="shelf-stage" aria-label="pi-studio workspaces and settings">
  <!-- One masthead for both views. Its left side says where you are, its right side is the one door
       between the shelf and the settings page. -->
  <header class="masthead">
    <div class="brand">
      <span class="brand-title">pi-studio</span>
      <span class="brand-sep" id="mastheadSep">·</span>
      <span class="brand-summary" id="mastheadContext"></span>
    </div>

    <!-- Shown on the settings page: one click, Esc or Alt+M returns to the shelf. -->
    <button type="button" class="masthead-nav-btn is-back" id="backToShelfBtn" hidden
            title="Return to the workspaces shelf (Esc or Alt+M)">
      <span class="glyph" aria-hidden="true">←</span>
      <span>back to workspaces</span>
    </button>

    <!-- Shown on the shelf: the door to the page that renders /settings/defaults. -->
    <button type="button" class="masthead-nav-btn" id="openSettingsBtn" hidden
            title="What a new board starts with (Alt+M)">
      <span class="glyph">settings →</span>
    </button>
  </header>

  <!-- ========================================================================
       VIEW 1: SETTINGS. The tree below is drawn from the daemon's JSON document.
       ======================================================================== -->
  <section class="shelf-box" id="settingsView" hidden aria-label="New board defaults">
    <div class="settings-head">
      <div class="settings-head-left">
        <div class="settings-title-row">
          <h1 class="settings-title" id="docTitle">Settings</h1>
          <span class="settings-schema-tag" id="docVersion"></span>
        </div>
        <p class="settings-help" id="docHelp"></p>
      </div>
      <div class="settings-head-right">
        <span class="save-status" id="saveStatus" role="status" aria-live="polite"></span>
        <button type="button" class="fold-btn" id="toggleAllGroupsBtn" title="Fold or unfold every group">
          collapse all
        </button>
      </div>
    </div>

    <div class="settings-tree" id="settingsTree" role="region" aria-label="Settings groups" tabindex="-1"></div>

    <footer class="shelf-foot">
      <div class="foot-keys">
        <span><kbd>Tab</kbd> navigate</span>
        <span><kbd>Space</kbd><kbd>↵</kbd> fold group</span>
        <span><kbd>Esc</kbd> back to shelf</span>
      </div>
      <span class="foot-selected-path" id="settingsFootReadout">saved as you change it · POST /defaults</span>
    </footer>
  </section>

  <!-- ========================================================================
       VIEW 2: THE SHELF. One column of workspaces and one dual-purpose input.
       ======================================================================== -->
  <section class="shelf-box" id="shelfView" aria-label="Workspaces shelf">
    <div class="omnibar">
      <span class="omni-prompt" aria-hidden="true">/</span>
      <input
        id="omniInput"
        class="omni-input"
        type="text"
        spellcheck="false"
        autocomplete="off"
        placeholder="Filter workspaces, or type a folder path (~/projekty/…) and press Enter"
        aria-label="Filter workspaces or enter a folder path to open"
      />
      <span id="omniModeBadge" class="omni-mode" hidden>open path ↵</span>
      <button type="button" class="omni-browse" id="browseBtn" title="Pick a folder with the machine's own dialog (POST /pick-folder)">
        browse…
      </button>
    </div>

    <div id="pathActionRow" class="path-action-row" hidden>
      <div class="path-action-target">
        <span id="pathActionLabel">Open folder as workspace: </span><strong id="pathActionText"></strong>
      </div>
      <span class="path-action-hint">↵ Enter opens its board</span>
    </div>

    <ul class="ws-list" id="wsList" role="listbox" aria-label="Workspaces"></ul>

    <div class="empty-shelf" id="emptyShelf" hidden>
      <p class="empty-title" id="emptyTitle"></p>
      <p class="empty-copy" id="emptyCopy"></p>
    </div>

    <footer class="shelf-foot">
      <div class="foot-keys">
        <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
        <span><kbd>↵</kbd> open board</span>
        <span><kbd>Esc</kbd> clear</span>
        <span><kbd>Alt+M</kbd> settings</span>
      </div>
      <span class="foot-selected-path" id="selectedPathReadout"></span>
    </footer>
  </section>
</main>

<script src="/welcome.js"></script>
</body>
</html>
