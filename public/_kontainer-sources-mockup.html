<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi-studio · kontainer — recognized compose &amp; containerfiles mockup</title>
<style>
  :root {
    --k-bg: #0d1117;
    --k-bg-deep: #090d13;
    --k-card: #161b22;
    --k-head: #1c2128;
    --k-border: #30363d;
    --k-border-bright: #3d444d;
    --k-text: #e6edf3;
    --k-muted: #7d8590;
    --k-accent: #58a6ff;
    --k-accent-dim: #1f6feb;
    --k-green: #3fb950;
    --k-green-soft: #7ee08c;
    --k-amber: #d29922;
    --k-red: #f85149;
    --k-red-soft: #ff9189;
    --k-purple: #d2a8ff;
    --k-cyan: #56d4dd;
    --k-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --k-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--k-bg);
    color: var(--k-text);
    font: 13px/1.45 var(--k-sans);
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 6px; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--k-accent); outline-offset: 2px; }

  /* Simulated pi-studio board header */
  .board-hdr {
    height: 44px;
    background: #161b22;
    border-bottom: 1px solid var(--k-border);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    font: 12px var(--k-mono);
    color: var(--k-muted);
  }
  .board-hdr .brand { color: var(--k-text); font-weight: 600; }
  .board-hdr .ws { color: var(--k-text); background: var(--k-bg); border: 1px solid var(--k-border); border-radius: 6px; padding: 2px 8px; }
  .board-hdr .panel-name { color: var(--k-accent); font-weight: 600; }
  .board-hdr .spacer { flex: 1; }
  .board-hdr .mock-tag {
    font: 600 10px var(--k-mono);
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--k-cyan);
    background: rgba(86, 212, 221, .1);
    border: 1px solid rgba(86, 212, 221, .35);
    border-radius: 999px;
    padding: 2px 8px;
  }

  /* Kontainer drawer shell */
  #kontainerDrawer {
    height: calc(100vh - 44px);
    display: flex;
    flex-direction: column;
    background: var(--k-bg);
    color: var(--k-text);
  }
  .k-grow { flex: 1; }

  /* Top control bar (matches existing kontainer-drawer.css) */
  .k-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--k-bg);
    border-bottom: 1px solid var(--k-border);
    flex: none;
    flex-wrap: wrap;
  }
  .k-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 11px var(--k-mono);
    color: var(--k-muted);
    background: var(--k-card);
    border: 1px solid var(--k-border);
    border-radius: 999px;
    padding: 2px 9px;
    white-space: nowrap;
  }
  .k-pill .k-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--k-amber); flex: none; }
  .k-pill em { font-style: normal; color: var(--k-text); }
  .k-pill .k-warn { color: var(--k-amber); }
  .k-sep { width: 1px; height: 18px; background: var(--k-border); margin: 0 2px; flex: none; }
  .k-badge {
    font: 600 10px var(--k-mono);
    text-transform: uppercase;
    letter-spacing: .04em;
    padding: 1px 6px;
    border-radius: 999px;
    white-space: nowrap;
    flex: none;
  }
  .k-b-amber { color: #f0c05a; background: rgba(210,153,34,.16); border: 1px solid rgba(210,153,34,.45); }
  .k-b-red { color: var(--k-red-soft); background: rgba(248,81,73,.16); border: 1px solid rgba(248,81,73,.45); }
  .k-b-green { color: var(--k-green-soft); background: rgba(63,185,80,.14); border: 1px solid rgba(63,185,80,.38); }
  .k-b-muted { color: var(--k-muted); background: rgba(125,133,144,.12); border: 1px solid rgba(125,133,144,.28); text-transform: none; }
  .k-b-blue { color: var(--k-accent); background: rgba(88,166,255,.1); border: 1px solid rgba(88,166,255,.28); }
  .k-b-cyan { color: var(--k-cyan); background: rgba(86,212,221,.12); border: 1px solid rgba(86,212,221,.36); }
  .k-b-purple { color: var(--k-purple); background: rgba(210,168,255,.12); border: 1px solid rgba(210,168,255,.35); }

  .k-chip-group { display: inline-flex; align-items: center; gap: 4px; }
  .k-chip {
    font: 11px var(--k-mono);
    color: var(--k-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .12s;
  }
  .k-chip:hover { color: var(--k-text); background: var(--k-card); }
  .k-chip.active { color: var(--k-text); background: var(--k-head); border-color: var(--k-border-bright); }
  .k-chip .k-cnt { margin-left: 3px; color: var(--k-muted); }
  .k-chip.active .k-cnt { color: var(--k-accent); }
  .k-chip.k-issues .k-cnt { color: var(--k-amber); }

  .k-search-wrap { position: relative; display: inline-flex; align-items: center; }
  .k-search {
    width: 190px;
    font: 12px var(--k-mono);
    color: var(--k-text);
    background: var(--k-card);
    border: 1px solid var(--k-border);
    border-radius: 6px;
    padding: 4px 26px 4px 9px;
    outline: none;
  }
  .k-search::placeholder { color: var(--k-muted); }
  .k-search:focus { border-color: var(--k-accent); width: 225px; }
  .k-kbd {
    position: absolute;
    right: 6px;
    font: 10px var(--k-mono);
    color: var(--k-muted);
    border: 1px solid var(--k-border);
    border-radius: 4px;
    padding: 0 4px;
    pointer-events: none;
  }
  .k-bar-btn {
    font: 12px var(--k-mono);
    color: var(--k-muted);
    background: var(--k-card);
    border: 1px solid var(--k-border);
    border-radius: 6px;
    padding: 4px 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .k-bar-btn:hover { color: var(--k-text); border-color: var(--k-border-bright); }
  .k-mode-sel {
    font: 11px var(--k-mono);
    color: var(--k-muted);
    background: var(--k-card);
    border: 1px solid var(--k-border);
    border-radius: 6px;
    padding: 3px 6px;
  }

  /* Main workspace body */
  .k-body { flex: 1; min-height: 0; display: flex; position: relative; overflow: hidden; }
  .k-viewport {
    flex: 1;
    min-width: 0;
    overflow: auto;
    position: relative;
    background-color: var(--k-bg);
    background-image: radial-gradient(circle at 1px 1px, #1c232d 1px, transparent 0);
    background-size: 24px 24px;
    padding: 16px 20px 28px;
  }
  .k-stage { position: relative; min-width: 1060px; min-height: 100%; }

  /* SVG wires layer */
  .k-wires {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
    overflow: visible;
  }
  .k-wire-path { fill: none; stroke-linecap: round; transition: opacity 150ms ease, stroke-width 150ms ease; }
  .k-wire-path.k-flow { stroke-dasharray: 6 5; animation: kWireFlow 1.2s linear infinite; }
  .k-wire-path.k-drift { stroke-dasharray: 5 4; animation: kWireFlow .85s linear infinite; }
  .k-wire-path.k-src { stroke-dasharray: 3 4; }
  @keyframes kWireFlow { from { stroke-dashoffset: 22; } to { stroke-dashoffset: 0; } }
  .k-wire-path.k-dimmed { opacity: .10 !important; }
  .k-wire-path.k-lit { opacity: 1 !important; filter: drop-shadow(0 0 4px rgba(88,166,255,.35)); }

  /* 4-stratum topology grid: 00 Sources -> 01 Images -> 02 Runtime -> 03 Wiring */
  .k-grid {
    position: relative;
    z-index: 3;
    display: grid;
    grid-template-columns: minmax(225px, 0.96fr) minmax(205px, 0.88fr) minmax(295px, 1.38fr) minmax(205px, 0.86fr);
    gap: 44px;
    align-items: start;
  }
  .k-stratum { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .k-stratum-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 2px 5px;
    border-bottom: 1px solid rgba(48,54,61,.65);
    white-space: nowrap;
  }
  .k-stratum-head.k-stratum-sources {
    border-bottom-color: rgba(86, 212, 221, .35);
  }
  .k-stratum-label {
    font: 600 11px var(--k-mono);
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--k-muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .k-stratum-label .k-idx { color: var(--k-accent); opacity: .85; }
  .k-stratum-sources .k-stratum-label .k-idx { color: var(--k-cyan); }
  .k-stratum-meta { font: 11px var(--k-mono); color: var(--k-muted); }
  .k-col-list { display: flex; flex-direction: column; gap: 9px; }
  .k-wire-subhead {
    font: 600 10px var(--k-mono);
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--k-muted);
    margin-top: 4px;
    padding-left: 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Shared card chrome */
  .k-card {
    position: relative;
    background: var(--k-card);
    border: 1px solid var(--k-border);
    border-radius: 8px;
    padding: 9px 11px;
    cursor: pointer;
    transition: border-color 140ms ease, opacity 150ms ease, box-shadow 150ms ease, background 140ms ease;
    user-select: none;
  }
  .k-card:hover { border-color: var(--k-border-bright); background: #19202a; }
  .k-card.k-dimmed { opacity: .24; }
  .k-card.k-related { border-color: rgba(88,166,255,.5); }
  .k-card.k-selected {
    border-color: var(--k-accent);
    background: #182231;
    box-shadow: 0 0 0 1px rgba(88,166,255,.4), 0 10px 24px rgba(1,4,9,.55);
  }
  .k-jack {
    position: absolute;
    top: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--k-head);
    border: 1.5px solid var(--k-border-bright);
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 4;
  }
  .k-jack-l { left: -4px; }
  .k-jack-r { right: -4px; }
  .k-card.k-selected .k-jack,
  .k-card.k-related .k-jack { border-color: var(--k-accent); background: var(--k-accent); }

  /* ===== NEW: 00 Workspace Sources (Compose & Dockerfiles/Containerfiles) ===== */
  .k-src-card {
    border-left-width: 3px;
    padding: 9px 11px 8px;
  }
  .k-src-card.k-src-compose { border-left-color: var(--k-cyan); }
  .k-src-card.k-src-dockerfile { border-left-color: var(--k-accent); }
  .k-src-card.k-src-containerfile { border-left-color: var(--k-purple); }
  .k-src-card.k-src-unbuilt { border-style: dashed; border-left-style: solid; }

  .k-src-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .k-src-icon {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: 700 10px var(--k-mono);
    flex: none;
    background: var(--k-head);
    border: 1px solid var(--k-border);
  }
  .k-src-compose .k-src-icon { color: var(--k-cyan); border-color: rgba(86,212,221,.35); }
  .k-src-dockerfile .k-src-icon { color: var(--k-accent); border-color: rgba(88,166,255,.35); }
  .k-src-containerfile .k-src-icon { color: var(--k-purple); border-color: rgba(210,168,255,.35); }

  .k-src-path {
    font: 600 12px var(--k-mono);
    color: var(--k-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }
  .k-src-dir { color: var(--k-muted); font-weight: 400; }
  .k-src-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font: 11px var(--k-mono);
    color: var(--k-muted);
    margin-bottom: 6px;
  }
  .k-src-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 7px;
  }
  .k-svc-pill {
    font: 10px var(--k-mono);
    color: #c9d1d9;
    background: var(--k-bg);
    border: 1px solid var(--k-border);
    border-radius: 4px;
    padding: 1px 5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .k-svc-pill .k-mini-dot { width: 5px; height: 5px; border-radius: 50%; }
  .k-svc-pill .k-mini-dot.up { background: var(--k-green); }
  .k-svc-pill .k-mini-dot.warn { background: var(--k-amber); }
  .k-svc-pill .k-mini-dot.down { background: var(--k-muted); }

  .k-src-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding-top: 6px;
    border-top: 1px dashed #252c35;
  }
  .k-src-state {
    font: 10.5px var(--k-mono);
    color: var(--k-muted);
  }
  .k-src-state.k-ok { color: var(--k-green-soft); }
  .k-src-state.k-warn { color: #f0c05a; }
  .k-src-acts {
    display: inline-flex;
    gap: 4px;
  }
  .k-mini-btn {
    font: 10px var(--k-mono);
    color: var(--k-muted);
    background: var(--k-bg);
    border: 1px solid var(--k-border);
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
  }
  .k-mini-btn:hover { color: var(--k-text); border-color: var(--k-border-bright); background: var(--k-head); }
  .k-mini-btn.k-primary-mini { color: var(--k-accent); border-color: rgba(88,166,255,.4); background: rgba(88,166,255,.08); }
  .k-mini-btn.k-primary-mini:hover { background: rgba(88,166,255,.18); color: #fff; }

  /* Images column */
  .k-img-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .k-img-name { font: 600 12px var(--k-mono); color: var(--k-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-img-tag { color: var(--k-accent); font-weight: 500; }
  .k-img-sub { display: flex; align-items: center; justify-content: space-between; gap: 6px; font: 11px var(--k-mono); color: var(--k-muted); margin-bottom: 7px; }
  .k-layer-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; gap: 1.5px; background: #0d1117; }
  .k-layer-seg { height: 100%; border-radius: 1px; min-width: 4px; }
  .k-unused-tray { margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--k-border); display: flex; flex-direction: column; gap: 7px; }
  .k-unused-head { display: flex; align-items: center; justify-content: space-between; font: 11px var(--k-mono); color: var(--k-muted); }
  .k-link-act { background: none; border: 0; padding: 0; font: 11px var(--k-mono); color: var(--k-accent); cursor: pointer; }
  .k-link-act:hover { text-decoration: underline; }
  .k-card.k-unused-img { opacity: .62; border-style: dashed; }

  /* Runtime / Containers column */
  .k-compose-group {
    background: rgba(22,27,34,.35);
    border: 1px dashed #333c47;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .k-compose-head { display: flex; align-items: center; gap: 8px; padding: 0 2px 4px; }
  .k-compose-title { font: 600 11px var(--k-mono); color: var(--k-text); }
  .k-compose-tag { font: 10px var(--k-mono); color: var(--k-cyan); background: rgba(86,212,221,.08); border: 1px solid rgba(86,212,221,.28); border-radius: 4px; padding: 1px 5px; }
  .k-mini-acts { margin-left: auto; display: inline-flex; gap: 4px; opacity: .75; }
  .k-compose-group:hover .k-mini-acts { opacity: 1; }

  .k-ctr { border-left-width: 3px; padding: 9px 11px 8px; }
  .k-ctr.k-st-running { border-left-color: var(--k-green); }
  .k-ctr.k-st-warn { border-left-color: var(--k-amber); }
  .k-ctr.k-st-failed { border-left-color: var(--k-red); }
  .k-ctr.k-st-stopped { border-left-color: var(--k-muted); }
  .k-ctr-row1 { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
  .k-sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .k-sdot.k-running { background: var(--k-green); box-shadow: 0 0 0 3px rgba(63,185,80,.18); }
  .k-sdot.k-warn { background: var(--k-amber); box-shadow: 0 0 0 3px rgba(210,153,34,.2); }
  .k-sdot.k-failed { background: var(--k-red); box-shadow: 0 0 0 3px rgba(248,81,73,.22); }
  .k-ctr-name { font: 600 13px var(--k-sans); color: var(--k-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-ctr-id { font: 11px var(--k-mono); color: var(--k-muted); }
  .k-ctr-row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 11px var(--k-mono); color: var(--k-muted); margin-bottom: 6px; }
  .k-uptime.k-warn { color: #f0c05a; }
  .k-uptime.k-err { color: var(--k-red-soft); }
  .k-metrics { display: flex; align-items: center; gap: 10px; font: 11px var(--k-mono); color: var(--k-muted); }
  .k-bar-track { width: 34px; height: 4px; background: #0d1117; border-radius: 2px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .k-bar-fill { height: 100%; border-radius: 2px; }
  .k-port-chip { margin-left: auto; font: 11px var(--k-mono); color: var(--k-accent); background: rgba(88,166,255,.1); border: 1px solid rgba(88,166,255,.25); border-radius: 4px; padding: 0 5px; }

  /* Wiring column */
  .k-wire-card { padding: 7px 10px; display: flex; align-items: center; gap: 8px; }
  .k-wire-icon {
    width: 22px; height: 22px; border-radius: 5px;
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 11px var(--k-mono); flex: none;
    background: var(--k-head); border: 1px solid var(--k-border);
  }
  .k-wire-icon.k-port { color: var(--k-green-soft); border-color: rgba(63,185,80,.35); }
  .k-wire-icon.k-net { color: var(--k-accent); border-color: rgba(88,166,255,.35); }
  .k-wire-icon.k-vol { color: var(--k-purple); border-color: rgba(210,168,255,.35); }
  .k-wire-info { min-width: 0; flex: 1; }
  .k-wire-title { font: 600 12px var(--k-mono); color: var(--k-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-wire-meta { font: 11px var(--k-mono); color: var(--k-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Right inspector */
  .k-inspector {
    width: 340px;
    flex: none;
    background: var(--k-bg-deep);
    border-left: 1px solid var(--k-border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    z-index: 10;
  }
  .k-inspector.k-collapsed { display: none; }
  .k-insp-head { padding: 10px 12px; background: var(--k-head); border-bottom: 1px solid var(--k-border); display: flex; flex-direction: column; gap: 8px; }
  .k-insp-title-row { display: flex; align-items: center; gap: 8px; }
  .k-insp-name { font: 600 13.5px var(--k-mono); color: var(--k-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k-insp-kind { font: 10px var(--k-mono); text-transform: uppercase; color: var(--k-cyan); background: var(--k-bg); border: 1px solid rgba(86,212,221,.35); border-radius: 4px; padding: 1px 5px; flex: none; }
  .k-insp-close { margin-left: auto; background: transparent; border: 0; color: var(--k-muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 5px; border-radius: 4px; }
  .k-insp-close:hover { background: #21262d; color: var(--k-text); }
  .k-insp-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .k-act { font: 11px var(--k-mono); color: var(--k-text); background: var(--k-card); border: 1px solid var(--k-border); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  .k-act:hover { border-color: var(--k-border-bright); background: #21262d; }
  .k-act.k-primary { color: #fff; background: var(--k-accent-dim); border-color: var(--k-accent); }
  .k-act.k-primary:hover { background: #2b7bf0; }
  .k-tabs { display: flex; gap: 2px; padding: 6px 12px 0; border-bottom: 1px solid var(--k-border); background: var(--k-bg-deep); }

const state = { selected: "src-cf-worker", hovered: null, filter: "all", search: "", tab: "preview" };
let toastTimer = null;

function toast(msg) {
  const t = document.getElementById("kToast");
  t.textContent = msg;
  t.classList.add("k-show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("k-show"), 2600);
}

function relatedSet(id) {
  if (!id) return null;
  const set = new Set([id]);
  const src = DATA.sources.find((s) => s.id === id);
  if (src) {
    src.linksToImages.forEach((imgId) => {
      set.add(imgId);
      DATA.containers.filter((c) => c.imageId === imgId).forEach((c) => {
        set.add(c.id);
        c.wires.forEach((w) => set.add(w));
      });
    });
    return set;
  }
  const img = DATA.images.find((i) => i.id === id);
  if (img) {
    DATA.sources.filter((s) => s.linksToImages.includes(id)).forEach((s) => set.add(s.id));
    DATA.containers.filter((c) => c.imageId === id).forEach((c) => {
      set.add(c.id);
      c.wires.forEach((w) => set.add(w));
    });
    return set;
  }
  const ctr = DATA.containers.find((c) => c.id === id);
  if (ctr) {
    set.add(ctr.imageId);
    DATA.sources.filter((s) => s.linksToImages.includes(ctr.imageId) || s.linksToContainers.includes(id)).forEach((s) => set.add(s.id));
    ctr.wires.forEach((w) => set.add(w));
    return set;
  }
  const wire = DATA.wiring.find((w) => w.id === id);
  if (wire) {
    wire.ctrs.forEach((cid) => {
      set.add(cid);
      const c = DATA.containers.find((x) => x.id === cid);
      if (c) {
        set.add(c.imageId);
        DATA.sources.filter((s) => s.linksToImages.includes(c.imageId)).forEach((s) => set.add(s.id));
      }
    });
    return set;
  }
  return set;
}

function attachCardEvents(el, id) {
  el.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    e.stopPropagation();
    state.selected = id;
    render();
  });
  el.addEventListener("mouseenter", () => {
    if (state.hovered !== id) { state.hovered = id; paintFocus(); }
  });
  el.addEventListener("mouseleave", () => {
    if (state.hovered === id) { state.hovered = null; paintFocus(); }
  });
}

function applyFocus(el, id, rel) {
  el.classList.toggle("k-selected", state.selected === id);
  el.classList.toggle("k-related", Boolean(rel && rel.has(id)));
  el.classList.toggle("k-dimmed", Boolean(rel && !rel.has(id)));
}

function renderSources(rel) {
  const host = document.getElementById("colSources");
  host.replaceChildren();

  const compose = DATA.sources.filter((s) => s.kind === "compose");
  const buildFiles = DATA.sources.filter((s) => s.kind !== "compose");

  const addGroup = (label, count, items) => {
    const sub = document.createElement("div");
    sub.className = "k-wire-subhead";
    sub.innerHTML = `<span>${label}</span><span>${count}</span>`;
    host.append(sub);
    for (const s of items) {
      const card = document.createElement("div");
      card.className = `k-card k-src-card k-src-${s.kind}${s.unbuilt ? " k-src-unbuilt" : ""}`;
      card.dataset.nodeId = s.id;
      const iconText = s.kind === "compose" ? "C" : s.kind === "dockerfile" ? "D" : "CF";
      const pillsHtml = s.services
        ? `<div class="k-src-pills">${s.services.map((sv) => `<span class="k-svc-pill"><span class="k-mini-dot ${sv.state}"></span>${sv.name}</span>`).join("")}</div>`
        : "";
      const actionsHtml = s.kind === "compose"
        ? (s.unbuilt
            ? `<button class="k-mini-btn k-primary-mini" type="button" onclick="toast('compose up -d -f ${s.dir}${s.file}')">up -d</button>`
            : `<button class="k-mini-btn" type="button" onclick="toast('compose restart -f ${s.dir}${s.file}')">restart</button><button class="k-mini-btn" type="button" onclick="toast('compose down -f ${s.dir}${s.file}')">down</button>`)
        : `<button class="k-mini-btn k-primary-mini" type="button" onclick="toast('build ${s.dir}${s.file}')">${s.unbuilt ? "build" : "rebuild"}</button>`;

      card.innerHTML = `
        <div class="k-src-top">
          <span class="k-src-icon">${iconText}</span>
          <span class="k-src-path"><span class="k-src-dir">${s.dir}</span>${s.file}</span>
          <span class="k-grow"></span>
          <span class="k-badge ${s.badgeCls}">${s.badge}</span>
        </div>
        <div class="k-src-meta"><span>${s.meta}</span></div>
        ${pillsHtml}
        <div class="k-src-foot">
          <span class="k-src-state ${s.statusCls}">${s.statusText}</span>
          <span class="k-src-acts">
            <button class="k-mini-btn" type="button" onclick="toast('open ${s.dir}${s.file} on board')">open</button>
            ${actionsHtml}
          </span>
        </div>
        <span class="k-jack k-jack-r" data-jack="${s.id}-out"></span>
      `;
      applyFocus(card, s.id, rel);
      attachCardEvents(card, s.id);
      host.append(card);
    }
  };

  addGroup("compose stacks", compose.length, compose);
  addGroup("dockerfiles & containerfiles", buildFiles.length, buildFiles);
}

function renderImages(rel) {
  const host = document.getElementById("colImages");
  host.replaceChildren();
  const colors = ["#3d444d", "#1f6feb", "#58a6ff", "#3fb950", "#d29922", "#d2a8ff", "#f85149"];
  const active = DATA.images.filter((i) => i.inUse);
  const unused = DATA.images.filter((i) => !i.inUse);

  const mkImg = (img, isUnused) => {
    const card = document.createElement("div");
    card.className = `k-card${isUnused ? " k-unused-img" : ""}`;
    card.dataset.nodeId = img.id;
    const segs = Array.from({ length: img.layers }, (_, i) => `<span class="k-layer-seg" style="width:${100 / img.layers}%;background:${colors[i % colors.length]}"></span>`).join("");
    card.innerHTML = `
      <div class="k-img-top">
        <span class="k-img-name">${img.repo}:<span class="k-img-tag">${img.tag}</span></span>
        ${img.drift ? '<span class="k-badge k-b-amber">drift</span>' : ""}
      </div>
      <div class="k-img-sub"><span>${img.size} · ${img.layers} layers</span><span>${img.created}</span></div>
      <div class="k-layer-bar">${segs}</div>
      <span class="k-jack k-jack-l" data-jack="${img.id}-in"></span>
      <span class="k-jack k-jack-r" data-jack="${img.id}-out"></span>
    `;
    applyFocus(card, img.id, rel);
    attachCardEvents(card, img.id);
    return card;
  };

  active.forEach((i) => host.append(mkImg(i, false)));
  if (unused.length) {
    const tray = document.createElement("div");
    tray.className = "k-unused-tray";
    tray.innerHTML = `<div class="k-unused-head"><span>unused · 178 MB</span><button class="k-link-act" type="button" onclick="toast('prune unused images')">prune</button></div>`;
    unused.forEach((i) => tray.append(mkImg(i, true)));
    host.append(tray);
  }
}

function renderRuntime(rel) {
  const host = document.getElementById("colRuntime");
  host.replaceChildren();
  const mkCtr = (c) => {
    const stCls = c.state === "warn" ? "k-st-warn" : "k-st-running";
    const dotCls = c.state === "warn" ? "k-warn" : "k-running";
    const card = document.createElement("div");
    card.className = `k-card k-ctr ${stCls}`;
    card.dataset.nodeId = c.id;
    const cpuColor = c.cpu > 35 ? "var(--k-amber)" : "var(--k-green)";
    card.innerHTML = `
      <div class="k-ctr-row1">
        <span class="k-sdot ${dotCls}"></span>
        <span class="k-ctr-name">${c.name}</span>
        <span class="k-ctr-id">${c.shortId}</span>
        ${c.stale ? '<span class="k-badge k-b-amber">stale</span>' : ""}
      </div>
      <div class="k-ctr-row2">
        <span class="k-uptime${c.stale ? " k-warn" : ""}">${c.status}</span>
        <span>${DATA.images.find((i) => i.id === c.imageId)?.repo}:${DATA.images.find((i) => i.id === c.imageId)?.tag}</span>
      </div>
      <div class="k-metrics">
        <span>cpu ${c.cpu}% <span class="k-bar-track"><span class="k-bar-fill" style="width:${c.cpu}%;background:${cpuColor}"></span></span></span>
        <span>mem ${c.mem}</span>
        ${c.port ? `<span class="k-port-chip">${c.port}</span>` : ""}
      </div>
      <span class="k-jack k-jack-l" data-jack="${c.id}-in"></span>
      <span class="k-jack k-jack-r" data-jack="${c.id}-out"></span>
    `;
    applyFocus(card, c.id, rel);
    attachCardEvents(card, c.id);
    return card;
  };

  const grp = document.createElement("div");
  grp.className = "k-compose-group";
  grp.innerHTML = `
    <div class="k-compose-head">
      <span class="k-compose-tag">compose</span>
      <span class="k-compose-title">acme-platform</span>
      <span class="k-mini-acts">
        <button class="k-mini-btn" type="button" onclick="toast('compose restart acme-platform')">restart</button>
        <button class="k-mini-btn" type="button" onclick="toast('compose logs -f in terminal')">logs ↗</button>
      </span>
    </div>
  `;
  DATA.containers.filter((c) => c.project === "acme-platform").forEach((c) => grp.append(mkCtr(c)));
  host.append(grp);

  const sub = document.createElement("div");
  sub.className = "k-wire-subhead";
  sub.textContent = "standalone containers";
  host.append(sub);
  DATA.containers.filter((c) => !c.project).forEach((c) => host.append(mkCtr(c)));
}

function renderWiring(rel) {
  const host = document.getElementById("colWiring");
  host.replaceChildren();
  const sections = [["port", "host ports"], ["net", "networks"], ["vol", "volumes & mounts"]];
  for (const [kind, label] of sections) {
    const items = DATA.wiring.filter((w) => w.kind === kind);
    const sub = document.createElement("div");
    sub.className = "k-wire-subhead";
    sub.textContent = label;
    host.append(sub);
    for (const w of items) {
      const card = document.createElement("div");
      card.className = "k-card k-wire-card";
      card.dataset.nodeId = w.id;
      const icon = kind === "port" ? "⇄" : kind === "net" ? "⌘" : "▦";
      card.innerHTML = `
        <span class="k-wire-icon k-${kind}">${icon}</span>
        <div class="k-wire-info">
          <div class="k-wire-title">${w.title}</div>
          <div class="k-wire-meta">${w.meta}</div>
        </div>
        <span class="k-jack k-jack-l" data-jack="${w.id}-in"></span>
      `;
      applyFocus(card, w.id, rel);
      attachCardEvents(card, w.id);
      host.append(card);
    }
  }
}

function renderInspector() {
  const insp = document.getElementById("kInspector");
  insp.replaceChildren();
  if (!state.selected) { insp.classList.add("k-collapsed"); return; }
  insp.classList.remove("k-collapsed");

  const src = DATA.sources.find((s) => s.id === state.selected);
  if (src) {
    const kindLabel = src.kind === "compose" ? "compose" : src.kind === "dockerfile" ? "dockerfile" : "containerfile";
    const primaryAct = src.kind === "compose"
      ? `<button class="k-act k-primary" type="button" onclick="toast('compose up -d -f ${src.dir}${src.file}')">compose up -d</button>
         <button class="k-act" type="button" onclick="toast('compose restart')">restart</button>
         <button class="k-act" type="button" onclick="toast('compose down')">down</button>`
      : `<button class="k-act k-primary" type="button" onclick="toast('build ${src.dir}${src.file}')">${src.unbuilt ? "build image" : "rebuild image"}</button>
         <button class="k-act" type="button" onclick="toast('build --no-cache ${src.dir}${src.file}')">no-cache</button>`;

    const linkedImgs = src.linksToImages.map((id) => DATA.images.find((i) => i.id === id)).filter(Boolean);
    const linkedHtml = linkedImgs.length
      ? linkedImgs.map((img) => `<button class="k-ctr-link" type="button" onclick="selectNode('${img.id}')"><span>${img.repo}:${img.tag}</span><span style="color:var(--k-muted)">${img.size}</span></button>`).join("")
      : `<div style="font:11.5px var(--k-mono);color:var(--k-muted)">no local image linked yet</div>`;

    insp.innerHTML = `
      <div class="k-insp-head">
        <div class="k-insp-title-row">
          <span class="k-insp-kind">${kindLabel}</span>
          <span class="k-insp-name">${src.dir}${src.file}</span>
          <button class="k-insp-close" type="button" onclick="selectNode(null)" title="close">×</button>
        </div>
        <div class="k-insp-actions">
          ${primaryAct}
          <button class="k-act" type="button" onclick="toast('open ${src.dir}${src.file} as source card')">open on board</button>
        </div>
      </div>
      <div class="k-tabs">
        <button class="k-tab k-active" type="button">file preview</button>
        <button class="k-tab" type="button" onclick="toast('parsed targets & args')">targets</button>
      </div>
      <div class="k-insp-body">
        <div class="k-kv-list">
          <div class="k-kv-row"><span class="k-kv-k">Workspace path</span><span class="k-kv-v">${src.dir}${src.file}</span></div>
          <div class="k-kv-row"><span class="k-kv-k">Detected</span><span class="k-kv-v">${src.meta}</span></div>
          <div class="k-kv-row"><span class="k-kv-k">Build / Stack Status</span><span class="k-kv-v">${src.statusText}</span></div>
        </div>
        <div class="k-wire-subhead">source preview</div>
        <pre class="k-code-preview">${src.preview}</pre>
        <div class="k-wire-subhead">linked images</div>
        ${linkedHtml}
      </div>
    `;
    return;
  }

  const img = DATA.images.find((i) => i.id === state.selected);
  const ctr = DATA.containers.find((c) => c.id === state.selected);
  const wire = DATA.wiring.find((w) => w.id === state.selected);
  const label = img ? `${img.repo}:${img.tag}` : ctr ? ctr.name : wire ? wire.title : "";
  const kind = img ? "image" : ctr ? "container" : "wire";
  insp.innerHTML = `
    <div class="k-insp-head">
      <div class="k-insp-title-row">
        <span class="k-insp-kind">${kind}</span>
        <span class="k-insp-name">${label}</span>
        <button class="k-insp-close" type="button" onclick="selectNode(null)" title="close">×</button>
      </div>
    </div>
    <div class="k-insp-body">
      <div style="font:12px var(--k-mono);color:var(--k-muted)">
        Existing ${kind} inspector stays unchanged. Select any card in <strong>00 Sources · Definitions</strong> on the left to inspect a recognized compose file, Dockerfile, or Containerfile.
      </div>
    </div>
  `;
}

function selectNode(id) { state.selected = id; render(); }

function pointOf(node) {
  const stage = document.getElementById("kStage");
  const r = node.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
}

function drawWires() {
  const stage = document.getElementById("kStage");
  const svg = document.getElementById("kWireLayer");
  const w = stage.scrollWidth, h = stage.scrollHeight;
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.replaceChildren();

  const rel = relatedSet(state.hovered || state.selected);
  const jack = (id) => stage.querySelector(`[data-jack="${CSS.escape(id)}"]`);
  const mk = (p1, p2, stroke, width, cls) => {
    const dx = Math.max(32, Math.abs(p2.x - p1.x) * 0.48);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} C ${(p1.x + dx).toFixed(1)} ${p1.y.toFixed(1)}, ${(p2.x - dx).toFixed(1)} ${p2.y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`);
    path.setAttribute("stroke", stroke);
    path.setAttribute("stroke-width", width);
    path.setAttribute("class", `k-wire-path ${cls}`);
    svg.append(path);
  };

  // 00 Sources -> 01 Images
  for (const s of DATA.sources) {
    const sOut = jack(`${s.id}-out`);
    if (!sOut) continue;
    for (const imgId of s.linksToImages) {
      const iIn = jack(`${imgId}-in`);
      if (!iIn) continue;
      const hit = !rel || (rel.has(s.id) && rel.has(imgId));
      const img = DATA.images.find((i) => i.id === imgId);
      const stroke = img?.drift ? "#d29922" : s.kind === "compose" ? "#56d4dd" : s.kind === "containerfile" ? "#d2a8ff" : "#58a6ff";
      const cls = `${img?.drift ? "k-drift" : "k-src"} ${rel ? (hit ? "k-lit" : "k-dimmed") : ""}`;
      mk(pointOf(sOut), pointOf(iIn), stroke, hit && rel ? "2.1" : "1.4", cls);
    }
  }

  // 01 Images -> 02 Containers -> 03 Wiring
  for (const c of DATA.containers) {
    const cIn = jack(`${c.id}-in`), cOut = jack(`${c.id}-out`);
    if (!cIn || !cOut) continue;
    const iOut = jack(`${c.imageId}-out`);
    if (iOut) {
      const hit = !rel || (rel.has(c.id) && rel.has(c.imageId));
      const stroke = c.stale ? "#d29922" : "#3fb950";
      const cls = `${c.stale ? "k-drift" : "k-flow"} ${rel ? (hit ? "k-lit" : "k-dimmed") : ""}`;
      mk(pointOf(iOut), pointOf(cIn), stroke, hit && rel ? "2.2" : "1.5", cls);
    }
    for (const wid of c.wires) {
      const wIn = jack(`${wid}-in`);
      if (!wIn) continue;
      const hit = !rel || (rel.has(c.id) && rel.has(wid));
      const wire = DATA.wiring.find((x) => x.id === wid);
      const stroke = wire?.kind === "port" ? "#3fb950" : wire?.kind === "vol" ? "#d2a8ff" : "#58a6ff";
      const anim = wire?.kind === "vol" ? "" : "k-flow";
      mk(pointOf(cOut), pointOf(wIn), stroke, hit && rel ? "2.1" : "1.4", `${anim} ${rel ? (hit ? "k-lit" : "k-dimmed") : ""}`);
    }
  }
}

function paintFocus() {
  const rel = relatedSet(state.hovered || state.selected);
  document.querySelectorAll(".k-card[data-node-id]").forEach((el) => applyFocus(el, el.dataset.nodeId, rel));
  drawWires();
}

function render() {
  const rel = relatedSet(state.hovered || state.selected);
  renderSources(rel);
  renderImages(rel);
  renderRuntime(rel);
  renderWiring(rel);
  renderInspector();
  requestAnimationFrame(drawWires);
}

document.getElementById("kViewport").addEventListener("click", () => { state.selected = null; render(); });
window.addEventListener("resize", () => requestAnimationFrame(drawWires));
render();
</script>
</body>
</html>
