<!doctype html>
<!--
	pi-studio native Git Graph page, rendered in the board's top drawer or its own tab.

	The page speaks directly to `/git/init` and `/git/msg` using pi-studio's own client
	modules under `/client/gitgraph/` and needs no external editor extension. Diffs and
	files at a revision open inside `#ggViewer` using the board's shared diff table and
	read-only text surface.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>pi · git graph</title>
		<link rel="icon" href="/favicon.svg">
		<link rel="stylesheet" href="/client/gitgraph/gitgraph.css">
	</head>
	<body>
		<div id="topBar" hidden>
			<section id="statusStrip" class="statusStrip" role="status" aria-label="Git Graph status" aria-live="polite" aria-atomic="true" aria-busy="false" data-state="ready">
				<span id="statusSummary" class="statusSummary">
					<span id="statusIndicator" class="statusIndicator" aria-hidden="true"></span>
					<span id="statusText">Ready</span>
				</span>
			</section>
			<div id="stashListSlot"></div>
			<header id="controls" class="gitGraphToolbar" role="toolbar" aria-label="Git Graph controls">
				<div id="repoControl" class="toolbarGroup" title="Repository">
					<span class="toolbarLabel unselectable">Repo</span>
					<div id="repoSelect" class="dropdown"></div>
				</div>
				<div id="branchControl" class="toolbarGroup" title="Branches">
					<span class="toolbarLabel unselectable">Branches</span>
					<div id="branchSelect" class="dropdown"></div>
				</div>
				<div id="authorControl" class="toolbarGroup" title="Authors">
					<span class="toolbarLabel unselectable">Authors</span>
					<div id="authorSelect" class="dropdown"></div>
				</div>
				<div id="tagControl" class="toolbarGroup" title="Tags">
					<span class="toolbarLabel unselectable">Tags</span>
					<div id="tagSelect" class="dropdown"></div>
				</div>
				<label id="showRemoteBranchesControl" class="toolbarCheckbox">
					<input type="checkbox" id="showRemoteBranchesCheckbox" value="1" checked>
					<span>Remote branches</span>
				</label>
				<span id="findControl" class="toolbarFind" hidden>
					<input id="findInput" class="toolbarFindInput" type="search" aria-label="Find commits" placeholder="Find commits…" autocomplete="off" spellcheck="false">
					<span id="findMatchCount" class="toolbarFindCount" aria-live="polite"></span>
					<button id="findSearchHistoryBtn" class="toolbarIconButton" type="button" title="Search full history" aria-label="Search full history"><span class="toolbarIcon codicon codicon-history" aria-hidden="true"></span></button>
					<button id="findPreviousBtn" class="toolbarIconButton" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match"><span class="toolbarIcon codicon codicon-chevron-up" aria-hidden="true"></span></button>
					<button id="findNextBtn" class="toolbarIconButton" type="button" title="Next match (Enter)" aria-label="Next match"><span class="toolbarIcon codicon codicon-chevron-down" aria-hidden="true"></span></button>
					<button id="findClearBtn" class="toolbarIconButton" type="button" title="Clear find (Esc)" aria-label="Clear find"><span class="toolbarIcon codicon codicon-close" aria-hidden="true"></span></button>
				</span>
				<span class="toolbarActions">
					<button id="findBtn" class="toolbarIconButton" type="button" title="Find commits (Ctrl+F)" aria-label="Find commits"><span class="toolbarIcon codicon codicon-search" aria-hidden="true"></span></button>
					<button id="blinkHeadBtn" class="toolbarIconButton" type="button" title="Locate HEAD (Ctrl+H)" aria-label="Locate HEAD"><span class="toolbarIcon codicon codicon-target" aria-hidden="true"></span></button>
					<button id="fetchBtn" class="toolbarIconButton" type="button" title="Fetch from remotes" aria-label="Fetch" hidden><span class="toolbarIcon codicon codicon-arrow-down" aria-hidden="true"></span></button>
					<button id="pushTagsBtn" class="toolbarIconButton" type="button" title="Push all tags" aria-label="Push all tags" hidden><span class="toolbarIcon codicon codicon-arrow-up" aria-hidden="true"></span></button>
					<button id="settingsBtn" class="toolbarIconButton" type="button" title="Repository &amp; graph settings" aria-label="Settings"><span class="toolbarIcon codicon codicon-gear" aria-hidden="true"></span></button>
					<button id="refreshBtn" class="toolbarIconButton" type="button" title="Refresh (Ctrl+R)" aria-label="Refresh"><span class="toolbarIcon codicon codicon-refresh" aria-hidden="true"></span></button>
				</span>
			</header>
		</div>

		<dialog id="settingsWidget" aria-label="Repository settings"></dialog>

		<main id="commitGraph" hidden>
			<div id="commitTable"></div>
		</main>
		<div id="footer"></div>

		<div id="contextMenu" role="menu" popover="auto"></div>
		<dialog id="dialog" aria-labelledby="ggDialogTitle"></dialog>

		<div id="ggViewer" hidden>
			<div class="ggViewerBackdrop"></div>
			<div class="ggViewerPanel" role="dialog" aria-modal="true" aria-labelledby="ggViewerTitle">
				<div class="ggViewerBar">
					<span id="ggViewerTitle" class="ggViewerTitle"></span>
					<span id="ggViewerFlags" class="ggViewerFlags"></span>
					<button type="button" id="ggViewerCopy">Copy</button>
					<button type="button" id="ggViewerClose" aria-label="Close">✕</button>
				</div>
				<div class="ggViewerBody" id="ggViewerBody" tabindex="0"></div>
			</div>
		</div>

		<div id="ggNotice" hidden>
			<h2 id="ggNoticeTitle"></h2>
			<p id="ggNoticeDetail"></p>
			<button id="ggRetry" type="button">Retry</button>
		</div>

		<script type="module" src="/client/gitgraph/host.js"></script>
	</body>
</html>
