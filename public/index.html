<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi board</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --card-head: #1c2128;
    --border: #30363d; --border-bright: #3d444d;
    --text: #e6edf3; --muted: #7d8590;
    --accent: #58a6ff; --accent-dim: #1f6feb;
    --green: #3fb950; --amber: #d29922; --pink: #db61a2; --red: #f85149;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --lh: 20px;
    /* One number the rail, the canvas and the composer all agree on. */
    --rail: 252px;
  }
  body.rail-off { --rail: 0px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  /* Thin dark scrollbars, so the rail and a long card look like part of the board. */
  * { scrollbar-width: thin; scrollbar-color: #30363d transparent; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #21262d; border: 3px solid transparent;
    background-clip: content-box; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #3d444d; background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  body { font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The keyboard is a first-class way round this board, so focus is always visible, and it sits
     outside the element so a card border or a hover ring cannot hide it. */
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  /* The board's zoom scales everything drawn inside it, ring included, so the ring on the board is
     divided by the zoom the script publishes. Chrome outside the board keeps its plain 2px. */
  #world button:focus-visible, #world a:focus-visible, #world [tabindex]:focus-visible {
    outline-width: calc(2px / var(--zoom, 1)); outline-offset: calc(2px / var(--zoom, 1));
  }

  /* `hidden` is a scroll container, so a focused card can shift the board behind the pan state;
     `clip` is not. Where `clip` is unsupported the script zeroes that scroll offset instead. */
  #viewport {
    position: fixed; inset: 44px 0 96px var(--rail); overflow: hidden; overflow: clip;
    background-color: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, #21262d 1px, transparent 0);
    background-size: 24px 24px;
    cursor: grab;
  }
  #viewport.dragging { cursor: grabbing; }
  /* With the stream down nothing on the board can change, so it dims to read as stale. Each card's
     contents dim rather than the viewport, so a docked composer stays readable while the agent is
     blocked on a question. */
  body.link-down #world > .card > *:not(#composer),
  body.link-down #empty { opacity: .55; }
  /* Zoom is a real layout zoom, not a scaled bitmap: text is laid out at the size it is
     shown at, so it stays sharp instead of waiting for a repaint to catch up. */
  #world { position: absolute; top: 0; left: 0; zoom: 1; }

  /* The board at a glance: every card as a rectangle, the window you are looking through over them.
     It hangs under the header at the right, because the + button and the footer own the bottom edge.
     No panel and no blur, the way the git strip below it sits on the board: the picture is the only
     thing over the page, so a card behind the map reads through it. */
  #minimap {
    position: fixed; top: 56px; right: 12px; z-index: 9; display: none;
    width: 208px; height: 140px;
    cursor: crosshair; touch-action: none;
  }
  body.map-on #minimap { display: block; }

  /* The workspace's git state, hung under the minimap: branches as lanes, refs as pills, and a halo
     on a lane a thread is working in. No panel behind it and no clicks, so the board reads and pans
     through it, and the only pointer target on this edge stays the +. */
  #gitstrip {
    position: fixed; top: 212px; right: 12px; width: 208px; bottom: 80px; z-index: 8;
    display: none; pointer-events: none;
    /* A graph is cut by the window, not finished by it: the last rows fade rather than stop hard. */
    -webkit-mask-image: linear-gradient(to bottom, #000 93%, transparent);
    mask-image: linear-gradient(to bottom, #000 93%, transparent);
  }
  body.git-on #gitstrip { display: block; }
  /* With the map hidden the strip takes the room it left, rather than hanging in space. */
  body:not(.map-on) #gitstrip { top: 60px; }
  #gitgraph { display: block; width: 100%; height: 100%; }

  .card {
    position: absolute; display: flex; flex-direction: column; overflow: hidden;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(1, 4, 9, .5); min-width: 220px; min-height: 120px;
    transition: opacity .12s ease;
  }
  /* Selection is an outline, not a border colour: a card can then be active and still show its own
     state in the border, so waiting stays pink and replying stays amber. The width and the offset
     are divided by the zoom, like the focus ring, so both read the same at every fitted zoom. The
     offset clears the 1px halo a state colour draws, since outlines paint above shadows. */
  .card.active { outline: calc(2px / var(--zoom, 1)) solid var(--accent-dim);
    outline-offset: calc(2px / var(--zoom, 1));
    box-shadow: 0 12px 32px rgba(31, 111, 235, .25); }
  /* An answered question grows to hold its reply, up to a readable limit. */
  .card.auto-height { height: auto !important; min-height: 160px; max-height: 760px; }
  /* The badge and its pulse carry "new"; the border is left to the card's state. */
  .card.fresh { animation: freshPulse 1.8s ease-in-out 2; }
  @keyframes freshPulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(1, 4, 9, .5); }
    50% { box-shadow: 0 8px 32px rgba(88, 166, 255, .45); }
  }
  .new-badge {
    font: 11px var(--mono); text-transform: uppercase; letter-spacing: .5px;
    color: #0d1117; background: var(--accent); border-radius: 999px; padding: 1px 6px;
  }
  /* Same shape as the "new" tag, in the question colour: it is the way back to the card. */
  .ask-pill {
    font: 11px var(--mono); text-transform: uppercase; letter-spacing: .5px;
    color: #0d1117; background: var(--pink); border: 0; border-radius: 999px; padding: 1px 6px;
    cursor: pointer; white-space: nowrap;
  }
  .head {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; flex: none;
    background: var(--card-head); border-bottom: 1px solid var(--border);
    cursor: grab; user-select: none;
  }
  .card.dragging .head { cursor: grabbing; }
  /* One colour per kind, in the card head and the rail row alike. */
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.note { background: var(--muted); }
  .dot.code { background: #d2a8ff; }
  .dot.sticky { background: var(--amber); }
  .dot.question { background: var(--pink); box-shadow: 0 0 0 3px rgba(219,97,162,.18); }
  .title { font-weight: 600; font-size: 13px; letter-spacing: .2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
  /* The name while it is being typed: the same words in the same place, now editable. */
  .title-edit { font: 600 13px system-ui; letter-spacing: .2px; color: var(--text);
    background: #0d1117; border: 1px solid var(--accent); border-radius: 4px;
    padding: 1px 5px; outline: none; }
  .sub { color: var(--muted); font: 12px var(--mono); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .sub.expired { color: var(--red); }
  /* The role a child was spawned under. Smaller than the queue chip beside it, because it says what
     the thread is rather than what it is doing right now. */
  .role-chip { flex: none; font: 10px var(--mono); letter-spacing: .04em; color: var(--accent);
    background: rgba(88,166,255,.1); border: 1px solid rgba(88,166,255,.22); border-radius: 999px;
    padding: 0 6px; white-space: nowrap; }
  /* What a thread is for, next to the role it was spawned under. A mode is the human's, a role is the
     child's, and neither replaces the queue chip beside them. */
  .mode-chip { flex: none; font: 10px var(--mono); letter-spacing: .04em; color: #d29922;
    background: rgba(210,153,34,.12); border: 1px solid rgba(210,153,34,.35); border-radius: 999px;
    padding: 0 6px; white-space: nowrap; }
  /* At this zoom the board is read as a map of threads, so the arrows step out of the way. */
  #world > svg.away { opacity: 0; }
  .spacer { flex: 1; }
  #stop { color: #f85149; border-color: rgba(248,81,73,.4); }
  #stop[disabled] { color: var(--muted); border-color: #30363d; }
  .sticky-status.stopped { color: #f85149; }
  .chip { font: 12px var(--mono); color: var(--accent); background: rgba(88,166,255,.1);
    border: 1px solid rgba(88,166,255,.25); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .chip.queue-pos { color: #d29922; background: rgba(210,153,34,.12); border-color: rgba(210,153,34,.35); }
  .close { border: 0; background: transparent; color: var(--muted); font-size: 16px;
    line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .close:hover { background: #21262d; color: var(--text); }
  .reply { border: 0; background: transparent; color: var(--muted); font: 13px/1 system-ui;
    cursor: pointer; padding: 3px 5px; border-radius: 4px; }
  .reply:hover { background: #21262d; color: var(--accent); }
  .min { border: 0; background: transparent; color: var(--muted); font: 12px/1 system-ui;
    cursor: pointer; padding: 3px 5px; border-radius: 4px; }
  .min:hover { background: #21262d; color: var(--text); }
  /* Folded: the head is the whole card, and the real height stays saved for restoring. */
  .card.mini { height: auto !important; min-height: 0; }
  .card.mini .body, .card.mini .thread, .card.mini .card-live, .card.mini .resize { display: none; }
  .card.mini .head { border-bottom: none; }
  /* The pulse would repaint the halo of a card that holds the composer, so the amber ring is left
     to say it is the reply target. */
  .card.replying { border-color: #d29922; box-shadow: 0 0 0 1px rgba(210,153,34,.45), 0 12px 32px rgba(1,4,9,.5);
    animation: none; }

  /* The card a message is about: dashed, because the field itself lives in the thread's own window
     and a second amber ring would read as a second place to type. */
  .card.referenced { border-style: dashed; border-color: rgba(210,153,34,.75); }

  /* Follow-ups live under the card body, in the order they were asked. The whole column scrolls
     (.card-scroll), so the thread never grows a scrollbar of its own. */
  .thread { flex: none; border-top: 1px solid var(--border);
    background: #0f141b; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .thread[hidden] { display: none; }
  /* What the thread is doing right now, in the same rows the log keeps: the live step is read where
     its answer will appear, and it leaves for the log the moment it settles. It sits below the
     answer, pinned, so a long note cannot hide it; the column above keeps its scroll and its place. */
  .card-live { flex: 0 1 auto; min-height: 0; max-height: 50%; overflow-y: auto;
    border-top: 1px solid var(--border); background: #0b1017;
    padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 4px; }
  .card-live:empty { display: none; }
  /* The frame belongs to the rail, so a row in a card is the card's own: no box inside a box. */
  .card-live .act { background: transparent; border-color: transparent; padding: 2px 0; }
  /* The thread is the card, so a row in it has nobody to name. */
  .card-live .act .who { display: none; }
  .turn { display: flex; flex-direction: column; gap: 5px; }
  .turn + .turn { border-top: 1px dashed #21262d; padding-top: 8px; }
  .turn-q { color: #f0e6d2; background: #2a2415; border-left: 3px solid #d29922;
    padding: 6px 9px; border-radius: 4px; white-space: pre-wrap; font-size: 13px; }
  .turn-status { font: 11px var(--mono); color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; }
  .turn-status.answered { color: var(--green); }
  .turn-status.stopped { color: #f85149; }
  .turn-status.sent { color: var(--accent); }
  /* The agent's answer is the thing you came to read, so it reads at the card's own size. */
  .turn-a { padding: 0; color: #c9d1d9; font-size: 14px; }
  /* An answer with no words yet draws nothing, and the caret is what says text is still arriving. */
  .turn-a:empty { display: none; }
  /* A live step says the run is going and says what it is doing, so the empty answer is silent:
     a blinking bar is the one signal that says nothing at all. */
  .card.live .turn-a .caret { display: none; }
  .turn-a .caret { display: inline-block; width: 6px; height: 13px; margin-left: 3px;
    vertical-align: -1px; border-radius: 1px; background: var(--accent);
    animation: caret-blink 1.1s steps(2, start) infinite; }
  @keyframes caret-blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .turn-a .caret { animation: none; } }

  /* Markdown tables: a wide one scrolls sideways instead of bursting the card. */
  .table-wrap { overflow-x: auto; margin: 6px 0 10px; }
  .table-wrap table { border-collapse: collapse; font-size: 12.5px; }
  .table-wrap th, .table-wrap td { border: 1px solid #30363d; padding: 4px 9px;
    text-align: left; vertical-align: top; }
  .table-wrap th { background: #161b22; color: #e6edf3; font-weight: 600; white-space: nowrap; }
  .table-wrap tr:nth-child(even) td { background: rgba(22,27,34,.55); }

  /* One scroll column per card: the note and its follow-ups move together, so a card never has a
     scrollbar inside a scrollbar. */
  .card-scroll { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; }
  /* Fills the column on a fixed-height card, so the editor and the code view get the whole height,
     and pushes the column into scrolling when the text is long. A card grown to .auto-height has
     no fixed height to fill, so editing one falls back to its minimum while the editor is open. */
  .body { flex: 1 0 auto; position: relative; }
  /* The code view is absolutely positioned, so the body has no height of its own: the floor keeps
     a source card with follow-ups from handing the whole column to the thread. */
  .body.source-body { min-height: 140px; }
  .note-body { padding: 10px 12px; color: #c9d1d9; word-wrap: break-word; }
  /* A heading owns the text under it, so it keeps more air above than below. */
  .note-body h1, .note-body h2, .note-body h3 { margin: 14px 0 5px; color: #fff; }
  .note-body h1 { font-size: 17px; }
  .note-body h2 { font-size: 15.5px; }
  .note-body h3 { font-size: 14.5px; }
  .note-body > :first-child { margin-top: 0; }
  .note-body p { margin: 0 0 8px; }
  .note-body p:last-child { margin-bottom: 0; }
  .note-body strong { color: #fff; }
  .note-body em { color: #d2a8ff; font-style: normal; }
  .note-body code { font: 13px var(--mono); background: #21262d; padding: 1px 4px; border-radius: 4px; }
  .note-body pre { margin: 8px 0; padding: 8px 10px; background: #0d1117;
    border: 1px solid var(--border); border-radius: 6px; overflow: auto; }
  .note-body pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; white-space: pre; }
  .note-body .svg-wrap { margin: 8px 0; background: #0d1117; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; }
  .note-body .svg-wrap svg { max-width: 100%; height: auto; display: block; }
  /* A mermaid diagram arrives at the width its layout needs, so a wide graph keeps its text size
     and scrolls sideways rather than shrinking to nothing inside a narrow card. */
  .note-body .diagram-wrap { overflow-x: auto; }
  .note-body .diagram-wrap svg { max-width: none; }
  .note-body .diagram-error { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .note-body ul { margin: 0 0 8px; padding-left: 18px; list-style: disc; }
  .note-body li { margin: 1px 0; }
  /* A task item carries its own box in the text, so the list must not add a marker on top. */
  .note-body li[data-tick] { list-style: none; }
  .note-body blockquote, .sticky-reply blockquote { margin: 0 0 8px; padding: 2px 0 2px 10px;
    border-left: 2px solid var(--border-bright); color: var(--muted); }
  .note-body blockquote p, .sticky-reply blockquote p { margin: 0 0 4px; }
  .note-body blockquote p:last-child, .sticky-reply blockquote p:last-child { margin-bottom: 0; }
  .note-body .tick { color: var(--green); cursor: pointer; }
  .card .edit { border: 0; background: transparent; color: var(--muted); font-size: 14px;
    line-height: 1; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .card .edit:hover { background: #21262d; color: var(--text); }
  /* A floor, because a textarea has no height of its own: without one the card would collapse to its
     minimum and the editor be a slit. */
  .note-edit { width: 100%; height: 100%; min-height: 200px; resize: none; border: 0; outline: none;
    background: #0d1117; color: var(--text); font: 13px/1.55 var(--mono); padding: 10px 12px; }
  .note-body a { color: var(--accent); text-decoration: none; }
  .note-body a.xref, .sticky-reply a.xref { color: #79c0ff; border-bottom: 1px dotted rgba(121,192,255,.6);
    cursor: pointer; }
  .note-body a.xref:hover, .sticky-reply a.xref:hover { color: #a5d6ff; border-bottom-style: solid; }
  /* A link whose card was closed or never written: still clickable, but it says so before the click. */
  .note-body a.xref.stale, .sticky-reply a.xref.stale { color: var(--muted); opacity: .65;
    border-bottom-style: dashed; }
  /* A referenced card rings once so the eye finds it after the jump. */
  .card.flash { animation: flashRing 1.2s ease-out; }
  @keyframes flashRing {
    0% { box-shadow: 0 0 0 2px rgba(88,166,255,.9), 0 8px 24px rgba(1,4,9,.5); }
    100% { box-shadow: 0 0 0 14px rgba(88,166,255,0), 0 8px 24px rgba(1,4,9,.5); }
  }
  /* An open question is the one thing the agent is blocked on, so it reads differently from a
     card that merely has focus (.active), has just arrived (.fresh), holds the composer
     (.replying) or was just jumped to (.flash). Declared last, because an animation beats a
     plain declaration and would repaint the pink ring in the arrival colour. */
  .card.waiting { border-color: var(--pink); box-shadow: 0 0 0 1px rgba(219,97,162,.45), 0 12px 32px rgba(1,4,9,.5); animation: none; }
  .note-body hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }
  /* A delegate card folds the full prompt and its bill away, so the face stays a headline and a
     long prompt cannot stretch the card past its height cap. The fold rides inside the note's own
     holder, whose last block already carries the bottom margin, so it adds none of its own. */
  .card-details { margin: 0; border-top: 1px solid var(--border); }
  .card-details > summary { padding: 6px 0 0; color: var(--muted); font: 12px/1.4 system-ui; cursor: pointer; }
  .card-details > summary:hover { color: var(--text); }
  .card-details[open] > summary { color: var(--text); }
  .card-details > .details-body { max-height: 300px; overflow: auto; margin-top: 6px; }

  /* virtualized code view */
  .code-scroll { position: absolute; inset: 0; overflow: auto; background: #0f141b; }
  .code-inner { position: relative; min-width: 100%; }
  .row { position: absolute; left: 0; display: flex; font: 13px/var(--lh) var(--mono); white-space: pre; }
  .row .n { flex: none; width: 56px; text-align: right; padding-right: 12px; color: var(--muted); user-select: none; }
  .row .t { color: #c9d1d9; padding-right: 24px; }
  .row.hit { background: rgba(88,166,255,.13); box-shadow: inset 2px 0 0 var(--accent); }
  .row.hit .n { color: var(--accent); }
  .k { color: #ff7b72; } .s { color: #a5d6ff; } .c { color: #8b949e; font-style: italic; }
  .f { color: #d2a8ff; } .n2 { color: #79c0ff; }

  /* interactive question card */
  .q-body { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .q-text { color: var(--text); font-size: 14px; }
  .q-options { display: flex; flex-direction: column; gap: 6px; }
  .q-opt {
    text-align: left; font: 13px/1.4 system-ui, sans-serif; color: var(--text);
    background: #1c2128; border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; cursor: pointer;
  }
  .q-opt:hover:not(:disabled) { border-color: var(--accent-dim); background: #1f2631; }
  /* The keyboard path starts here, so a focused option looks like a hovered one rather than
     carrying the global outline on top of it. */
  .q-opt:focus-visible { outline: none; border-color: var(--accent-dim); background: #1f2631; }
  .q-opt:disabled { cursor: default; opacity: .55; }
  .q-opt.picked { border-color: var(--accent); background: rgba(88,166,255,.12); opacity: 1; }
  /* A question that takes several answers draws its options as boxes, so a click fills the
     question in instead of answering it. The glyph is the button's own state, which is why it is
     a pseudo element and not a second node the answer matching has to skip over. */
  .q-opt.q-check::before { content: "☐ "; color: var(--muted); }
  .q-opt.q-check.picked::before { content: "☑ "; color: var(--accent); }
  .q-free { display: flex; gap: 6px; }
  .q-free input {
    flex: 1; font: 13px system-ui, sans-serif; color: var(--text); background: #0d1117;
    border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; outline: none;
  }
  .q-free input:focus { border-color: var(--accent-dim); }
  .q-done { color: var(--muted); font: 12px var(--mono); }
  .q-done.q-problem { color: var(--red); }

  .resize { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
    background: linear-gradient(135deg, transparent 50%, var(--border-bright) 50%);
    border-bottom-right-radius: 9px; }

  header {
    position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 10;
    display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 13px;
    background: rgba(13,17,23,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  header .brand { font-weight: 700; letter-spacing: .3px; }
  header .live { display: flex; align-items: center; gap: 6px; color: var(--green); }
  header .live b { width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    display: inline-block; box-shadow: 0 0 0 3px rgba(63,185,80,.15); }
  header .live.down { color: var(--red); }
  header .live.down b { background: var(--red); box-shadow: 0 0 0 3px rgba(248,81,73,.15); }
  /* A running agent is shown amber, so it reads as busy without the alarm of a red link. */
  header .live.working { color: var(--amber); font-variant-numeric: tabular-nums; }
  header .live.working b { background: var(--amber); box-shadow: 0 0 0 3px rgba(210,153,34,.15);
    animation: pulseDot 1.1s ease-in-out infinite; }
  header .hint { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .sess { font: 13px var(--mono); color: var(--text); }
  header .sess b { color: var(--accent); font-weight: 600; }
  /* A daemon booted on another state folder is a second instance, and says so beside the workspace. */
  header .sess .instance { margin-left: 6px; color: var(--amber); font-size: 11px; }
  header .stat { font: 12px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
  header .stat:empty { display: none; }
  /* The footer is a quiet strip: the same figures as a console session, out of the way of the cards. */
  #footer { position: fixed; left: var(--rail, 0); right: 0; bottom: 0; z-index: 40; display: flex;
    align-items: center; gap: 14px; height: 24px; padding: 0 12px; background: #0d1117;
    border-top: 1px solid var(--border); }
  #footer .stat { font: 11px var(--mono); color: var(--muted); }
  #footer .stat:empty { display: none; }
  #footer .stat em { color: var(--text); font-style: normal; }
  /* A note that reports a failure carries the same red the composer's own hint does. */
  #footer .stat.bad { color: var(--red); }
  #footer .grow { flex: 1; }
  body.rail-off #footer { left: 0; }
  header .stat em { color: var(--text); font-style: normal; }
  /* The chip is also the compact button: the same box as its neighbours, so it has to keep their
     metrics. `appearance` strips the button chrome, and the width is pinned to the seven
     characters of "ctx 42%" so a one-digit percentage does not make it narrower. */
  #statCtx { cursor: pointer; appearance: none; position: relative;
    min-width: calc(7ch + 14px + 2px); }
  /* `display` on the id beats the user agent's [hidden] rule, so hiding is spelled out. */
  #statCtx[hidden] { display: none; }
  #statCtx #statCtxValue { color: var(--text); white-space: nowrap; }
  /* Overlaid rather than laid out beside the number, so the word costs the chip no width. */
  #statCtx .act { position: absolute; inset: 0; display: grid; place-items: center;
    visibility: hidden; color: var(--accent); pointer-events: none; }
  #statCtx:hover, #statCtx:focus-visible { color: var(--text); border-color: var(--border-bright); }
  #statCtx:hover #statCtxValue, #statCtx:focus-visible #statCtxValue { visibility: hidden; }
  #statCtx:hover .act, #statCtx:focus-visible .act { visibility: visible; }
  /* Nothing to compact while a run is in flight: compaction aborts it first, so the action is
     not offered, but a click still answers why rather than doing nothing. */
  #statCtx.busy:hover #statCtxValue, #statCtx.busy:focus-visible #statCtxValue { visibility: visible; }
  #statCtx.busy:hover .act, #statCtx.busy:focus-visible .act { visibility: hidden; }

  /* activity rail */
  #rail {
    position: fixed; top: 44px; left: 0; bottom: 0; width: var(--rail); z-index: 8;
    background: #0a0f16; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; font: 12px var(--mono); overflow: hidden;
  }
  body.rail-off #rail { display: none; }
  /* A collapsed rail leaves a small tab, so activity is never more than one click away. */
  #railOpen { display: none; position: fixed; top: 52px; left: 0; z-index: 8;
    background: #0a0f16; border: 1px solid var(--border); border-left: none;
    border-radius: 0 6px 6px 0; color: var(--muted); font: 11px var(--mono);
    text-transform: uppercase; letter-spacing: .6px; padding: 8px 6px; cursor: pointer;
    writing-mode: vertical-rl; }
  #railOpen:hover { color: var(--text); }
  #railOpen b { color: var(--accent); }
  body.rail-off #railOpen { display: block; }
  /* Drag handle. Six invisible pixels that turn into a line under the cursor. */
  #railGrip { position: absolute; top: 0; bottom: 0; right: 0; width: 6px;
    cursor: col-resize; background: transparent; z-index: 2; }
  #railGrip:hover, body.rail-resizing #railGrip { background: var(--accent-dim); }
  body.rail-resizing { cursor: col-resize; user-select: none; }
  #rail .rail-head { padding: 8px 12px 4px; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: .6px; display: flex; gap: 6px; align-items: center; }
  /* `display: flex` above outranks the browser's own `[hidden]`, so an empty head is hidden here too. */
  #rail .rail-head[hidden] { display: none; }
  #rail .rail-head b { color: var(--accent); font-weight: 600; }
  #railToggle { margin-left: auto; background: none; border: none; color: var(--muted);
    cursor: pointer; font: 12px var(--mono); padding: 0 2px; line-height: 1; }
  #railToggle:hover { color: var(--text); }
  #railNow { padding: 0 8px 6px; display: flex; flex-direction: column; gap: 4px; }
  /* A running row lives in its thread's card, so this strip holds only the runs whose card is closed. */
  #railNow:empty { display: none; }
  #railLog { flex: 1; overflow-y: auto; padding: 4px 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  /* Cards first: the rail is the map of a board too big to read on the canvas. The cap keeps
     the activity feed below it visible however many cards there are. */
  #railCards { flex: 0 1 auto; min-height: 0; max-height: 45%; overflow-y: auto;
    padding: 0 8px 6px; display: flex; flex-direction: column; gap: 2px; }
  #railCards:empty { display: none; }
  /* Closed cards keep a row of their own: a card put away while it still holds a conversation is one
     click from coming back, and the row is where that click lives. */
  #railClosed { flex: 0 1 auto; min-height: 0; max-height: 30%; overflow-y: auto;
    padding: 0 8px 6px; display: flex; flex-direction: column; gap: 2px; }
  #railClosed:empty { display: none; }
  #railCards .rail-card, #railClosed .rail-card { display: flex; align-items: center; gap: 6px; width: 100%; flex: none;
    padding: 3px 6px; border: 1px solid transparent; border-radius: 6px; background: none;
    color: inherit; font: inherit; text-align: left; cursor: pointer; }
  #railCards .rail-card:hover, #railClosed .rail-card:hover { background: #0f141b; border-color: #1c2128; }
  #railCards .rail-card:focus-visible, #railClosed .rail-card:focus-visible { outline: none; border-color: var(--accent-dim); }
  #railCards .rail-card .dot, #railClosed .rail-card .dot { width: 6px; height: 6px; }
  #railClosed .rail-card .dot { opacity: .55; }
  #railCards .rail-title, #railClosed .rail-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--text); }
  #railClosed .rail-title { color: var(--muted); }
  #railCards .rail-state, #railClosed .rail-state { flex: none; color: var(--muted); font-size: 11px; }
  #railCards .rail-card.wants .rail-state { color: var(--pink); }
  #railCards .rail-card.updated .rail-state { color: var(--accent); }
  #railClosed .rail-card .rail-state { color: var(--accent); }
  #railClosed .rail-card:hover .rail-title { color: var(--text); }
  /* One foldable section per thread: the rail is a stack of conversations, not one long log. */
  #railLog .rail-thread { display: flex; flex-direction: column; gap: 4px; flex: none; }
  #railLog .rail-thread-head { display: flex; align-items: center; gap: 6px; width: 100%; flex: none;
    padding: 2px 6px; background: transparent; border: 1px solid transparent; border-radius: 6px;
    color: var(--muted); font: inherit; font-size: 11px; text-align: left; cursor: pointer; }
  #railLog .rail-thread-head:hover { background: #0f141b; border-color: #1c2128; }
  #railLog .rail-thread-head:focus-visible { outline: none; border-color: var(--accent-dim); }
  #railLog .rail-thread-head .chev { flex: none; width: 8px; text-align: center; }
  #railLog .rail-thread-head .chev::before { content: "▾"; }
  #railLog .rail-thread.folded .rail-thread-head .chev::before { content: "▸"; }
  #railLog .rail-thread-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--text); }
  #railLog .rail-thread-count { flex: none; }
  #railLog .rail-thread-stats { flex: none; color: var(--muted); font: 10px var(--mono); }
  #railLog .rail-thread-stats:empty { display: none; }
  /* The stop sits where the thread's own numbers are, because both belong to that thread. */
  #railLog .rail-thread-stop { flex: none; padding: 0 3px; border: 0; border-radius: 4px;
    background: transparent; color: #f85149; font: 10px/1 system-ui; cursor: pointer; }
  #railLog .rail-thread-stop:hover { background: rgba(248, 81, 73, .14); color: #ff7b72; }
  #railLog .rail-thread-stop[hidden] { display: none; }
  #railLog .rail-thread-role { flex: none; font: 10px var(--mono); color: var(--accent);
    background: rgba(88,166,255,.1); border: 1px solid rgba(88,166,255,.22); border-radius: 999px;
    padding: 0 5px; }
  #railLog .rail-thread-role[hidden] { display: none; }
  /* A child sits under the thread that spawned it: indented, and with a rule down its left edge so
     the fan of children reads as one thing. */
  #railLog .rail-thread.child { margin-left: 9px; }
  #railLog .rail-thread.child > .rail-thread-head { border-left: 1px solid #1c2128; border-radius: 0 6px 6px 0; }
  #railLog .rail-thread-body { display: flex; flex-direction: column; gap: 4px; }
  #railLog .rail-thread.folded .rail-thread-body { display: none; }
  .act { border-radius: 6px; padding: 5px 7px; background: #0f141b; border: 1px solid #1c2128;
    flex: none; }
  .act .top { display: flex; align-items: center; gap: 6px; }
  .act .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--green); }
  .act.running .dot { background: var(--accent); animation: pulseDot 1.1s ease-in-out infinite; }
  .act.error .dot { background: var(--red); }
  .act.error { border-color: rgba(248,81,73,.45); }
  .act .name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act .who { flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--muted); font: 10px var(--mono); }
  .act .ms { margin-left: auto; color: var(--muted); font-size: 11px; flex: none; }
  .act .target, .act .note { color: var(--muted); font-size: 11px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .act.reply { background: #10161e; border-color: #232a33; }
  .act.reply .note, .act.thinking .tail { white-space: pre-wrap; display: -webkit-box;
    -webkit-box-orient: vertical; }
  .act.reply .note { color: #c9d1d9; -webkit-line-clamp: 4; }
  /* A thought streams in paragraphs, so its tail keeps the newest characters dim and monospaced
     and clamps the height, which leaves the rest of the rail where it was. No scroll of its own. */
  .act.thinking .tail { margin-top: 2px; color: var(--muted); font: 10px/1.35 var(--mono);
    overflow-wrap: anywhere; overflow: hidden; -webkit-line-clamp: 5; }
  @keyframes pulseDot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* composer */
  #composer {
    position: fixed; left: var(--rail); right: 0; bottom: 0; z-index: 9; height: 96px;
    display: flex; gap: 10px; padding: 10px 14px; background: rgba(10,15,22,.96);
    border-top: 1px solid var(--border); backdrop-filter: blur(8px);
  }
  /* A board of threads has no single session to message, so its field lives inside a card and the
     bottom bar is gone. The same client serves a one-session board, which keeps both. */
  body.threads #viewport { inset: 44px 0 0 var(--rail); }
  body.threads #composer:not(.docked) { display: none; }
  body.threads #newThread { display: grid; }
  #composer .type { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  /* Docked: the same field, living at the bottom of the card it is replying to. */
  #composer.docked {
    position: relative; left: auto; right: auto; bottom: auto; top: auto;
    height: auto; flex: none; padding: 8px 10px; gap: 8px;
    background: #0f141b; border-top: 1px solid var(--border); backdrop-filter: none;
  }
  #composer.docked textarea { min-height: 54px; max-height: 150px; font-size: 13px; }
  /* The conversation behind a thread, opened from the activity rail. A drawer over the board: it costs
     nothing while closed, and the canvas does not have to make room for it. */
  #transcript { position: fixed; right: 14px; bottom: 42px; width: min(660px, 48vw); height: min(72vh, 780px);
    display: flex; flex-direction: column; background: rgba(13,17,23,.96); border: 1px solid var(--border);
    border-radius: 10px; box-shadow: 0 18px 48px rgba(0,0,0,.6); z-index: 60; }
  #transcript[hidden] { display: none; }
  .tr-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-bottom: 1px solid var(--border); font: 12px var(--mono); color: var(--muted); }
  .tr-title { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr-note { margin-left: auto; white-space: nowrap; opacity: .85; }
  .tr-head button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px;
    font: 11px var(--mono); padding: 2px 7px; cursor: pointer; }
  .tr-head button.on { color: var(--accent); border-color: var(--accent-dim); }
  .tr-body { flex: 1; overflow: auto; padding: 8px 12px 16px; font: 12px/1.55 var(--mono); }
  .tr-entry { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .tr-entry::before { content: attr(data-mark); margin-right: 6px; opacity: .7; }
  .tr-entry.user { color: var(--amber); }
  .tr-entry.answer { color: var(--text); }
  .tr-entry.thinking { color: var(--muted); font-style: italic; }
  .tr-entry.call { color: var(--accent); }
  .tr-entry.result { color: #9fb0c0; opacity: .8; padding-left: 12px; border-left: 1px solid var(--border); }
  /* A narrow card cannot hold the field and the buttons side by side, so they stack: buttons
     on the right of the first row, the chip and the field filling the second. */
  #composer.docked { flex-wrap: wrap; }
  #composer.docked .side { order: 1; flex: 1 1 100%; flex-direction: row;
    justify-content: flex-end; align-items: center; gap: 8px; }
  #composer.docked .type { order: 2; flex: 1 1 100%; }
  #composer.docked .hintline { display: none; }
  .card.replying .resize { display: none; }
  /* Floating above the composer, so attachments never squeeze the textarea. */
  #attachments { position: absolute; bottom: 100%; left: 14px; display: flex; gap: 6px; padding-bottom: 6px; }
  #attachments:empty { display: none; }
  #attachments .shot { position: relative; }
  #attachments .shot img { height: 64px; border-radius: 5px; border: 1px solid var(--border); display: block; }
  #attachments .shot button { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px;
    border-radius: 50%; border: 1px solid var(--border); background: #21262d; color: var(--text);
    font: 10px var(--mono); line-height: 1; cursor: pointer; padding: 0; }
  /* One row, scrolling sideways, so a long list of picks costs one line of the field. */
  #pathChips { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; }
  #pathChips:empty { display: none; }
  #pathChips .chip { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; max-width: 240px;
    font: 11px var(--mono); color: var(--text); background: #161b22;
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 4px 2px 9px; }
  #pathChips .chip.folder { color: var(--accent); border-color: var(--accent-dim); }
  #pathChips .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pathChips .chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font: 12px var(--mono); line-height: 1; padding: 1px 4px; border-radius: 50%; }
  #pathChips .chip button:hover { background: #21262d; color: var(--text); }
  #composer textarea {
    flex: 1; resize: none; font: 14px/1.45 system-ui, sans-serif; color: var(--text);
    background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent-dim); }
  #composer .side { display: flex; flex-direction: column; gap: 6px; justify-content: space-between; }
  #composer .modes { display: flex; gap: 6px; flex-wrap: wrap; }
  #composer .modes button { font: 11px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  #composer .modes button.on { color: #0d1117; background: var(--accent); border-color: var(--accent); }
  /* How hard the model thinks is worn by the think chip: its border takes the level's colour from
     the ironbow ramp and a soft halo of the same hue sits around it. Two shadows, a tight one and a
     wide one, so the halo has a hot core instead of reading as a flat ring. The script sets both
     colours, and takes them off again at `off`, so the chip then falls back to the plain border it
     always had. The ramp stops at yellow, so the hardest think reads warm rather than white-hot. */
  #thinkPick {
    border-color: var(--heat-tint, var(--border));
    box-shadow: 0 0 3px var(--heat-haze, transparent), 0 0 11px var(--heat-haze, transparent);
  }
  #composer #send { font: 12px var(--mono); color: #0d1117; background: var(--green);
    border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  #composer #send:disabled { opacity: .5; cursor: default; }
  /* The context figure is also the compact button, and the fill behind the words is how much of the
     window that thread has spent. It wears its neighbours' box, so the row keeps one rhythm. */
  #composer #ctxBtn { position: relative; overflow: hidden; appearance: none; cursor: pointer;
    font: 11px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; --fill: 0%; }
  /* `display` on the id beats the user agent's [hidden] rule, so hiding is spelled out. */
  #composer #ctxBtn[hidden] { display: none; }
  /* One width is the whole meter: the fill is a wash over the button's own ground, so the label stays
     readable at every percentage and no second element has to be kept in step. */
  #composer #ctxBtn::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: var(--fill);
    background: linear-gradient(180deg, rgba(88,166,255,.3), rgba(88,166,255,.14)); pointer-events: none; }
  #composer #ctxBtn span { position: relative; }
  #composer #ctxBtn:hover, #composer #ctxBtn:focus-visible { color: var(--text); border-color: var(--border-bright); }
  /* Half the window gone is where the number stops being a statistic: the fill takes the amber the
     board uses for work in flight, and a sheen crosses it the way heat crosses iron. */
  #composer #ctxBtn.hot { color: #e3b341; border-color: rgba(210,153,34,.55); }
  #composer #ctxBtn.hot::before { background: linear-gradient(180deg, rgba(210,153,34,.36), rgba(210,153,34,.16)); }
  #composer #ctxBtn.hot::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.22) 50%, transparent 62%);
    background-size: 200% 100%; animation: ironSheen 2.6s linear infinite; }
  /* Near the window's edge the same heat goes red, because past this the next answer is the one at risk. */
  #composer #ctxBtn.full { color: var(--red); border-color: rgba(248,81,73,.55); }
  #composer #ctxBtn.full::before { background: linear-gradient(180deg, rgba(248,81,73,.36), rgba(248,81,73,.16)); }
  @keyframes ironSheen { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  /* Nothing to do while the child is busy: the press answers with the reason rather than looking stuck. */
  #composer #ctxBtn.working { color: var(--text); cursor: progress; }
  #composer #ctxBtn.working::after { animation: none; }
  #composer .hintline { color: var(--muted); font: 11px var(--mono); }
  /* A note that reports a failure, so it does not read as the usual quiet hint. */
  #composer .hintline.bad { color: var(--red); }
  /* Which card the next message answers, shown above the box until it is sent or cleared. */
  #replyChip { display: flex; align-items: center; gap: 6px; align-self: flex-start;
    font: 11px var(--mono); color: #e3b341; background: rgba(210,153,34,.12);
    border: 1px solid rgba(210,153,34,.4); border-radius: 999px; padding: 2px 4px 2px 9px;
    max-width: 100%; }
  #replyChip[hidden] { display: none; }
  #replyChipText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replyChip button { border: 0; background: transparent; color: #e3b341; cursor: pointer;
    font: 12px var(--mono); line-height: 1; padding: 1px 4px; border-radius: 50%; }
  #replyChip button:hover { background: rgba(210,153,34,.25); }

  /* Folder picker: anchored above the composer, sized so a folder fits in one glance. */
  /* One button starts a thread. It sits where the eye goes for "make another one" and stays out
     of the canvas, so it can never be buried under a card. */
  #newThread {
    /* Clear of the footer: it sits on the bottom edge, and a button half under it reads as broken. */
    position: fixed; right: 18px; bottom: 34px; z-index: 12;
    width: 46px; height: 46px; border-radius: 50%;
    display: none; place-items: center; padding: 0;
    font-size: 24px; line-height: 1; font-weight: 400;
    color: #0d1117; background: var(--accent); border: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.45);
  }
  #newThread:hover { filter: brightness(1.08); }
  #newThread:disabled { opacity: .55; cursor: progress; }
  #newThread:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  /* The model and thinking pickers: one panel above the composer, one shape for both. */
  #runtimePick { position: fixed; z-index: 2000; display: flex; flex-direction: column; gap: 6px;
    width: 340px; max-height: 46vh; padding: 8px; background: rgba(13,17,23,.98);
    border: 1px solid var(--border-bright); border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  #runtimePick[hidden] { display: none; }
  #runtimePick input { font: 11px var(--mono); color: var(--text); background: #0d1117;
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; }
  #runtimePick input:focus { outline: none; border-color: var(--accent-dim); }
  #runtimePick input[hidden] { display: none; }
  #runtimeList { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  #runtimeList:empty { display: none; }
  #runtimeList .pick-group { font: 10px var(--mono); color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; padding: 6px 4px 2px; }
  #runtimeList .pick-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    font: 11px var(--mono); color: var(--text); background: transparent; border: 0;
    border-radius: 6px; padding: 4px 6px; cursor: pointer; text-align: left; }
  #runtimeList .pick-row:hover { background: #161b22; }
  #runtimeList .pick-row.on { color: var(--accent); }
  #runtimeList .pick-row .pick-meta { color: var(--muted); font: 10px var(--mono); }
  /* A tool kept from a new thread: the row says `off` and goes quiet, so a list where most are on
     reads as a list of names rather than a wall of colour. */
  #runtimeList .pick-row.tool-off, #runtimeList .pick-row.tool-off .pick-meta { color: var(--muted); }
  /* The one row that swaps the scope for the whole catalogue: a door, so it reads as one. It sits last
     under the scope and first above the full list, and a divider points the way it leads. */
  #runtimeList .pick-more { color: var(--amber); justify-content: flex-start; }
  #runtimeList .pick-more:hover { background: #161b22; }
  #runtimeList .pick-more.last { border-top: 1px solid var(--border); border-radius: 0 0 6px 6px; margin-top: 2px; }
  #runtimeList .pick-more.first { border-bottom: 1px solid var(--border); border-radius: 6px 6px 0 0; margin-bottom: 2px; }
  #runtimeList .pick-note { color: var(--muted); font: 11px var(--mono); padding: 4px 6px; }

  #picker { position: fixed; z-index: 2000; display: flex; flex-direction: column; gap: 6px;
    padding: 8px; background: rgba(13,17,23,.98); border: 1px solid var(--border-bright);
    border-radius: 10px; box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  #picker[hidden] { display: none; }
  #picker .p-row { display: flex; gap: 6px; align-items: center; }
  #picker input[type=text] { flex: 1; min-width: 0; font: 11px var(--mono); color: var(--text);
    background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
  #picker input[type=text]:focus { outline: none; border-color: var(--accent-dim); }
  #picker button { font: 11px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  #picker button:hover { color: var(--text); border-color: var(--border-bright); }
  #picker button:disabled { opacity: .4; cursor: default; }
  #picker .p-hidden { display: flex; align-items: center; gap: 4px; font: 11px var(--mono);
    color: var(--muted); white-space: nowrap; cursor: pointer; }
  #pickList { max-height: 230px; overflow: auto; border: 1px solid var(--border);
    border-radius: 6px; background: #0d1117; }
  /* Each row is a real button so the list can be walked with the keyboard; the button look is
     stripped so a row still reads as a row. */
  #pickList .p-item { display: flex; align-items: center; gap: 7px; padding: 3px 6px; width: 100%;
    font: 12px var(--mono); color: var(--text); background: none; border: 0; text-align: left;
    cursor: pointer; }
  #pickList .p-item:hover, #pickList .p-item.hl { background: #161b22; }
  #pickList .p-item.on .p-name { color: var(--green); }
  #pickList .p-item .p-tick { color: var(--muted); font-size: 10px; width: 9px; }
  #pickList .p-item.on .p-tick { color: var(--green); }
  #pickList .p-item .p-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pickList .p-item.dir .p-name { color: var(--accent); }
  #pickList .p-item .p-open { border: 0; background: transparent; color: var(--muted);
    cursor: pointer; font: 13px var(--mono); padding: 0 4px; }
  #pickList .p-item .p-open:hover { color: var(--text); }
  #pickList .p-empty { padding: 12px; color: var(--muted); font: 11px var(--mono); text-align: center; }
  #pickError { font: 11px var(--mono); color: var(--red); padding: 0 2px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #pickError[hidden] { display: none; }
  #pickCount { flex: 1; font: 11px var(--mono); color: var(--muted); }

  /* What a rail row hides: a sheet over the whole board, so nothing it covers is clickable while
     it is open. The body is the one scroll container, because a long output or thought is what
     the panel is for. */
  #actDetail { position: fixed; inset: 0; z-index: 2200; padding: 40px 24px;
    background: rgba(1, 4, 9, .66); display: flex; align-items: center; justify-content: center; }
  #actDetail[hidden] { display: none; }
  #actDetail .panel { display: flex; flex-direction: column; width: min(880px, 100%);
    max-height: 100%; overflow: hidden; background: var(--card);
    border: 1px solid var(--border-bright); border-radius: 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55); }
  #actDetail .panel-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    flex: none; background: var(--card-head); border-bottom: 1px solid var(--border);
    font: 12px var(--mono); }
  #actDetail .name { color: var(--text); font-weight: 600; }
  #actDetail .meta { color: var(--muted); font-size: 11px; margin-left: auto; }
  #actDetail .panel-head .close { flex: none; }
  #actDetailBody { overflow: auto; min-height: 0; padding: 10px;
    display: flex; flex-direction: column; gap: 10px; }
  #actDetail section { display: flex; flex-direction: column; gap: 4px; }
  #actDetail h4 { margin: 0; color: var(--muted); font: 11px var(--mono);
    text-transform: uppercase; letter-spacing: .6px; }
  #actDetail pre { margin: 0; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
    background: #0d1117; color: #c9d1d9; font: 11px/1.45 var(--mono);
    white-space: pre-wrap; overflow-wrap: anywhere; }
  #actDetail .cut { color: var(--amber); font: 11px var(--mono); }
  #actDetail .gone { color: var(--muted); font: 11px var(--mono); }
  /* The parts of a call a renderer lays out: an argument list, code with a gutter, a diff, a picture. */
  #actDetail .act-kv { display: flex; flex-direction: column; gap: 2px; font: 11px var(--mono); }
  #actDetail .act-row { display: flex; gap: 8px; }
  #actDetail .act-row .k { flex: none; min-width: 60px; color: var(--muted); }
  #actDetail .act-row .v { color: #c9d1d9; overflow-wrap: anywhere; }
  #actDetail .act-code { border: 1px solid var(--border); border-radius: 6px; background: #0d1117;
    max-height: 46vh; overflow: auto; padding: 6px 0; font: 11px/1.45 var(--mono); }
  #actDetail .act-line { display: flex; gap: 8px; padding: 0 8px; }
  #actDetail .act-line .n { flex: none; width: 34px; text-align: right; color: #484f58; user-select: none; }
  #actDetail .act-line .t { white-space: pre; color: #c9d1d9; }
  #actDetail .act-diff .act-line.add { background: rgba(63, 185, 80, .12); }
  #actDetail .act-diff .act-line.del { background: rgba(248, 81, 73, .12); }
  #actDetail .act-diff .act-line.hunk { color: #8b949e; }
  #actDetail .act-img { max-width: 100%; border: 1px solid var(--border); border-radius: 6px; background: #0d1117; }
  #actDetail .act-options { margin: 0; padding-left: 18px; color: #c9d1d9; font-size: 12.5px; }
  #actDetail .act-prose { white-space: pre-wrap; overflow-wrap: anywhere; color: #c9d1d9;
    font-size: 12.5px; line-height: 1.5; }
  #actDetail .act-note { font-size: 13px; color: #c9d1d9; }
  #actDetail .act-note .svg-wrap { margin: 8px 0; background: #0d1117; border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; }
  #actDetail .act-note .svg-wrap svg { max-width: 100%; height: auto; display: block; }
  #actDetail .act-note .diagram-wrap { overflow-x: auto; }
  #actDetail .act-note .diagram-wrap svg { max-width: none; }
  #actDetail .act-note .diagram-error { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  /* sticky card */
  .sticky-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .sticky-text { color: #f0e6d2; background: #2a2415; border-left: 3px solid #d29922;
    padding: 8px 10px; border-radius: 4px; white-space: pre-wrap; overflow-wrap: anywhere;
    font-size: 13px; }
  .sticky-status { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .sticky-status.sent { color: var(--accent); }
  .sticky-status.answered { color: var(--green); }
  .sticky-reply { border-top: 1px dashed #30363d; padding-top: 8px; color: #c9d1d9; font-size: 13px; }
  /* The tree the thread works in: one muted line, readable but never louder than the answer. */
  .sticky-worktree { display: flex; gap: 8px; align-items: center; font: 11px var(--mono);
    color: var(--muted); border-top: 1px dashed #21262d; padding-top: 6px; overflow: hidden; }
  .sticky-worktree .tree-branch { color: #8b949e; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .sticky-worktree .tree-warn { color: #d29922; flex: none; }
  .sticky-worktree.skipped { color: var(--muted); opacity: .8; }
  header .grow { flex: 1; }
  header button { font: 12px var(--mono); color: var(--muted); background: #161b22;
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  header button:hover { color: var(--text); border-color: var(--border-bright); }
  /* A selected card is the conversation being read, so the other threads step back rather than
     disappear: still legible, plainly not what you are looking at. */
  .card.dim { opacity: .7; }
  /* The second press of `new` is the confirmation, so the button says so. */
  header button.armed { color: #f85149; border-color: rgba(248, 81, 73, .5); }
  #boardConfig { position: fixed; z-index: 2000; top: 46px; right: 12px; display: flex; flex-direction: column;
    gap: 1px; width: 232px; padding: 8px; background: #0d1117; border: 1px solid var(--border-bright);
    border-radius: 8px; box-shadow: 0 12px 32px rgba(1, 4, 9, .55); }
  #boardConfig[hidden] { display: none; }
  #boardConfig .cfg-head { margin: 0 0 4px; color: var(--muted); font: 10px var(--mono);
    text-transform: uppercase; letter-spacing: .5px; }
  /* Label above value: a model name is long, and a column of names reads better than three rows of
     arguments about where each one ends. */
  #boardConfig .cfg-row { display: block; width: 100%; padding: 4px 6px; border: 0; border-radius: 5px;
    background: transparent; text-align: left; cursor: pointer; }
  #boardConfig .cfg-row:hover { background: #161b22; }
  #boardConfig .cfg-row span { display: block; color: var(--muted); font: 9px var(--mono);
    text-transform: uppercase; letter-spacing: .6px; }
  #boardConfig .cfg-row b { display: block; color: var(--accent); font: 12px var(--mono); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #boardConfig .cfg-note { margin: 6px 2px 0; color: var(--muted); font: 10px/1.45 var(--mono); }
  /* The prompt files are plain markdown, so the editor is a list and a textarea: what is saved is what
     the daemon reads on the next thread that starts. */
  #promptEditor { position: fixed; z-index: 2100; top: 46px; right: 252px; display: flex;
    flex-direction: column; gap: 6px; width: 420px; padding: 10px; background: #0d1117;
    border: 1px solid var(--border-bright); border-radius: 8px; box-shadow: 0 12px 32px rgba(1, 4, 9, .55); }
  #promptEditor[hidden] { display: none; }
  #promptEditor .cfg-head { margin: 0; color: var(--muted); font: 10px var(--mono);
    text-transform: uppercase; letter-spacing: .5px; }
  #promptEditor select { background: #161b22; color: var(--text); border: 1px solid var(--border-bright);
    border-radius: 5px; font: 12px var(--mono); padding: 3px 4px; }
  #promptEditor textarea { height: 340px; resize: vertical; background: #010409; color: var(--text);
    border: 1px solid var(--border-bright); border-radius: 5px; padding: 8px;
    font: 12px/1.5 var(--mono); outline: none; }
  #promptEditor textarea:focus-visible { border-color: var(--accent-dim); }
  #promptEditor .pe-foot { display: flex; align-items: center; gap: 8px; }
  #promptEditor .pe-foot span { flex: 1; min-width: 0; color: var(--muted); font: 10px var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #promptEditor .pe-foot button { background: #21262d; color: var(--text); border: 1px solid var(--border-bright);
    border-radius: 5px; font: 11px var(--mono); padding: 3px 10px; cursor: pointer; }
  #promptEditor .pe-foot button:hover { background: #30363d; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
    font-size: 14px; pointer-events: none; text-align: center; padding: 20px; }
  /* Each of the board's three animations repeats a state the text already spells out, so the board
     loses nothing when the reader asks for less motion. Last, because it kills rules from the card
     states, the header and the rail alike. */
  @media (prefers-reduced-motion: reduce) {
    .card.fresh, .card.flash, header .live.working b, .act.running .dot, #composer #ctxBtn.hot::after { animation: none; }
  }
</style>
</head>
<body>
<header>
  <span class="brand" title="ctrl+wheel: zoom · wheel or drag background: pan · middle-drag anywhere: pan · drag a card: move · ctrl+drag a card: select its text · corner: resize · esc: unselect · f: fit · 0: 100% · m: map · n: next · r: reply · q: close · ctrl+z: undo close · o: thread order">pi</span>
  <button class="sess" id="sess" type="button" title="switch workspace"></button>
  <!-- Polite, so the state is spoken when it changes; the elapsed clock is decoration that ticks
       every second and is hidden, so it is never read out. -->
  <span class="live" id="live" role="status" aria-live="polite"><b aria-hidden="true"></b> <span id="liveText">connecting</span><span id="liveClock" aria-hidden="true"></span></span>
  <span class="grow"></span>
  <!-- The context chip is also the compact button: the action sits on the number it changes,
       and the word appears on hover or focus so the row keeps its width at rest. -->
  <button class="stat" id="statCtx" title="compact the context, the same as /compact" hidden><span id="statCtxValue"></span><span class="act" aria-hidden="true">compact</span></button>
  <button id="newPill" style="display:none">0 new</button>
  <button id="stop" style="display:none" title="stop this run (same as escape)">stop</button>
  <button id="threadOrder"></button>
  <button id="stack" title="cascade every thread again under its root">stack</button>
  <button id="tidy">tidy</button>
  <button id="fit">fit all</button>
  <button id="reset">100%</button>
  <button id="mapBtn" aria-pressed="true" title="hide the board overview (m)">map</button>
  <button id="cleanBtn" title="forget dead threads and their logs">clean</button>
  <button id="newBtn" title="start over in this workspace: same folder, same settings, empty board">new</button>
  <button id="configBtn" title="this board's settings: default model, thinking, dimming, and which tools a new thread gets" aria-haspopup="dialog" aria-expanded="false">settings</button>
</header>

<!-- The board's own numbers, the way a console keeps them along its bottom edge: what answers, what
     it has cost, how much of a context is in play, and how many threads are running. -->
<footer id="footer">
  <span class="stat" id="statModel"></span>
  <span class="stat" id="statTokens"></span>
  <span class="stat" id="statCost"></span>
  <span class="stat" id="footCtx"></span>
  <span class="stat" id="footRun"></span>
  <span class="grow"></span>
  <span class="stat hint" id="footHint"></span>
</footer>

<!-- The board's own configuration. Model and level share the picker the composer uses, so there is
     one list of models in the whole app. -->
<div id="boardConfig" hidden role="dialog" aria-label="this board's settings">
  <p class="cfg-head">this board</p>
  <button type="button" class="cfg-row" id="cfgDim"><span>dim other threads</span><b id="cfgDimValue">on</b></button>
  <button type="button" class="cfg-row" id="cfgModel"><span>default model</span><b id="cfgModelValue"></b></button>
  <button type="button" class="cfg-row" id="cfgThinking"><span>default thinking</span><b id="cfgThinkingValue"></b></button>
  <button type="button" class="cfg-row" id="cfgTools"><span>tools in a new thread</span><b id="cfgToolsValue"></b></button>
  <button type="button" class="cfg-row" id="cfgPath"><span>flow for a new boss</span><b id="cfgPathValue">auto</b></button>
  <button type="button" class="cfg-row" id="cfgPrompts"><span>prompts</span><b id="cfgPromptsValue">roles · modes · flows</b></button>
  <p class="cfg-note">a new thread starts with these. new boards take their defaults from the crossroads.</p>
</div>

<div id="promptEditor" hidden role="dialog" aria-label="prompt files">
  <p class="cfg-head">prompts</p>
  <select id="pePick" aria-label="which prompt"></select>
  <textarea id="peText" spellcheck="false" aria-label="the prompt text"></textarea>
  <div class="pe-foot">
    <span id="peHint" role="status" aria-live="polite"></span>
    <button type="button" id="peSave">save</button>
  </div>
</div>

<aside id="rail">
  <div class="rail-head">cards <b id="railCardCount"></b><button id="railToggle" title="hide the rail">«</button></div>
  <div id="railCards"></div>
  <div class="rail-head" id="railClosedHead" hidden>closed <b id="railClosedCount"></b></div>
  <div id="railClosed"></div>
  <div class="rail-head">activity <b id="railRunning"></b></div>
  <div id="railNow"></div>
  <div id="railLog"></div>
  <div id="railGrip" title="drag to resize"></div>
</aside>
<button id="railOpen" title="show activity">activity <b id="railOpenCount"></b></button>

<div id="composer">
  <div class="type">
    <div id="replyChip" hidden><span id="replyChipText"></span><button id="replyChipClear" title="ask on the board instead of in this card">×</button></div>
    <div id="pathChips"></div>
    <div id="attachments"></div>
    <textarea id="msg" placeholder="message the agent…  (enter sends, shift+enter for a new line, paste an image or pick files)"></textarea>
  </div>
  <div class="side">
    <div class="modes">
      <button data-mode="queue" class="on">queue</button>
      <button data-mode="steer">steer</button>
      <button id="forkMode" type="button" title="ask a new thread instead of the one that made this card">fork</button>
      <button id="modePick" type="button" title="an agent does the work, a plan plans, a boss spawns children">agent</button>
      <button id="pathPick" type="button" hidden title="the flow a boss runs">auto</button>
      <button id="modelPick" type="button" title="the model this card answers with">model</button>
      <button id="thinkPick" type="button" title="how hard the model thinks before answering">think</button>
      <button id="ctxBtn" type="button" hidden><span id="ctxLabel"></span></button>
      <button id="pickFiles" title="attach files or folders from disk">files</button>
    </div>
    <span class="hintline" id="composerHint" role="status" aria-live="polite"></span>
    <button id="send">send</button>
  </div>
</div>

<aside id="transcript" hidden aria-label="thread transcript">
  <div class="tr-head">
    <span class="tr-title"></span>
    <span class="tr-note"></span>
    <button type="button" id="trFollow" class="on" title="keep up while the run writes">follow</button>
    <button type="button" id="trClose" title="close">×</button>
  </div>
  <div class="tr-body" id="trBody"></div>
</aside>

<button id="newThread" type="button" aria-label="start a new thread" title="start a new thread (t)">+</button>

<div id="runtimePick" hidden>
  <input id="runtimeSearch" type="text" placeholder="search models…" autocomplete="off" spellcheck="false" />
  <div id="runtimeList"></div>
</div>

<div id="viewport">
  <div id="world"></div>
  <div class="empty" id="empty">press + or t to start a thread</div>
</div>

<!-- The board at a glance, drawn from the cards this page already holds. It is a mouse handle on
     the view; the keyboard has f, 0 and n for the same journeys. -->
<canvas id="minimap" role="img" aria-label="the board at a glance: click or drag to move the view"></canvas>

<!-- What the workspace's git state looks like: the daemon reads the graph and this draws it, so the
     board's own page never runs git. It says nothing when the folder is not a repository. -->
<div id="gitstrip">
  <canvas id="gitgraph" role="img" aria-label="branches and commits in this workspace"></canvas>
</div>

<div id="picker" role="dialog" aria-label="attach files or folders" hidden>
  <div class="p-row">
    <button id="pickUp" title="parent folder">↑</button>
    <input id="pickPath" type="text" spellcheck="false" title="type a folder and press enter" />
    <button id="pickHome" title="home folder">home</button>
    <button id="pickCwd" title="session folder">session</button>
    <button id="pickClose" title="close">×</button>
  </div>
  <div class="p-row">
    <input id="pickFilter" type="text" placeholder="filter this folder…" spellcheck="false" />
    <label class="p-hidden"><input type="checkbox" id="pickHidden" /> hidden</label>
  </div>
  <div id="pickError" hidden></div>
  <div id="pickList"></div>
  <div class="p-row">
    <span id="pickCount">nothing picked</span>
    <button id="pickHere" title="pick the folder you are looking at">+ this folder</button>
    <button id="pickDone" title="keep what is picked and close">done</button>
  </div>
</div>

<!-- The full text behind one activity row: its arguments, log, output, thought or answer. -->
<div id="actDetail" role="dialog" aria-modal="true" aria-labelledby="actDetailName" tabindex="-1" hidden>
  <div class="panel">
    <div class="panel-head">
      <span class="name" id="actDetailName"></span>
      <span class="meta" id="actDetailMeta"></span>
      <button class="close" id="actDetailClose" title="close (esc)">×</button>
    </div>
    <!-- Focusable so a keyboard user can scroll past the first screen; it is the second tab stop. -->
    <div id="actDetailBody" tabindex="0"></div>
  </div>
</div>

<script type="module" src="/client/board.js"></script>
</body>
</html>
